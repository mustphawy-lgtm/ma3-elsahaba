<title>مع الصحابة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Markazi+Text:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600&display=swap">
<style>
/* Layout: فهرس تحريري مرقّم للحلقات في الرئيسية، وصفحة لكل صحابي (الحلقة والملخص بالتوقيت والمحاور)، والخريطة صفحة مستقلة */
:root{
  --paper:#F1EFE9; --sheet:#FAF9F6; --ink:#161A2A; --ink-2:#3B3F52; --muted:#6E7183; --rule:#D8D4CA;
  --lapis:#24449C; --lapis-ink:#1B357D; --lapis-soft:#E2E7F4;
  --ok:#2C6E49; --warn:#9A6A12; --bad:#A03A2C; --note:#55607E;
  --f-name:"Aref Ruqaa","Amiri",serif;
  --f-text:"Markazi Text","Amiri","Traditional Arabic",serif;
  --f-ui:"Readex Pro",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1220; --sheet:#151A2C; --ink:#ECE9E1; --ink-2:#C9C7C0; --muted:#9295A6; --rule:#2A3046;
  --lapis:#8EA6EC; --lapis-ink:#B4C4F3; --lapis-soft:#1E2747;
  --ok:#7CC29A; --warn:#D9AE5C; --bad:#E58A7B; --note:#A6B0CC; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1220; --sheet:#151A2C; --ink:#ECE9E1; --ink-2:#C9C7C0; --muted:#9295A6; --rule:#2A3046;
  --lapis:#8EA6EC; --lapis-ink:#B4C4F3; --lapis-soft:#1E2747;
  --ok:#7CC29A; --warn:#D9AE5C; --bad:#E58A7B; --note:#A6B0CC; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-text);font-size:21px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1140px;margin-inline:auto}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--lapis);outline-offset:3px;border-radius:4px}
.ui{font-family:var(--f-ui);font-size:14px;line-height:1.5}
.eyebrow{font-family:var(--f-ui);font-size:12.5px;letter-spacing:.04em;color:var(--muted)}

/* شريط علوي */
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px 14px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.mark{font-family:var(--f-name);font-size:34px;line-height:1;text-decoration:none;color:var(--ink)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{font-family:var(--f-ui);font-size:14px;text-decoration:none;color:var(--muted);padding:7px 12px;border-radius:999px}
.nav a[aria-current="page"]{color:var(--ink);background:var(--sheet);box-shadow:inset 0 0 0 1px var(--rule)}
.nav a:hover{color:var(--ink)}

/* الرئيسية */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:end;padding-block:48px 40px;border-bottom:1px solid var(--rule)}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:28px;padding-block:32px}}
.hero h1{font-family:var(--f-name);font-weight:400;font-size:clamp(56px,10vw,112px);line-height:1.05;margin:0}
.hero .lede{font-size:24px;line-height:1.6;color:var(--ink-2);margin:14px 0 0;max-width:30ch}
.latest{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:22px 24px;text-decoration:none;display:block;transition:border-color .2s}
.latest:hover{border-color:var(--lapis)}
.latest .nm{font-family:var(--f-name);font-size:40px;line-height:1.2;margin:6px 0 2px}
.latest .q{font-size:22px;color:var(--lapis-ink);margin:0 0 12px}
.latest .meta{display:flex;gap:14px;flex-wrap:wrap}
.cta{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-ui);font-size:14px;font-weight:500;color:var(--sheet);background:var(--ink);padding:9px 16px;border-radius:999px;margin-top:16px}

.sec{padding-block:40px 8px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.sec-h h2{font-family:var(--f-text);font-weight:700;font-size:30px;margin:0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-family:var(--f-ui);font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2);background:transparent}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

.index{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.row{display:grid;grid-template-columns:56px minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:20px;align-items:baseline;padding:18px 4px;border-bottom:1px solid var(--rule);text-decoration:none;transition:background .2s}
.row:hover{background:var(--sheet)}
.row .no{font-family:var(--f-ui);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .nm{font-family:var(--f-name);font-size:32px;line-height:1.2}
.row .q{font-size:21px;color:var(--ink-2);line-height:1.5}
.row .dur{font-family:var(--f-ui);font-size:13px;color:var(--muted);white-space:nowrap}
.row .soon{font-family:var(--f-ui);font-size:12px;color:var(--warn)}
@media (max-width:720px){.row{grid-template-columns:40px minmax(0,1fr);gap:4px 12px}.row .q{grid-column:2}.row .dur{grid-column:2}}

.about{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;padding-block:44px;border-top:1px solid var(--rule);margin-top:40px}
@media (max-width:820px){.about{grid-template-columns:1fr}}
.about h3{font-family:var(--f-ui);font-size:14px;font-weight:600;margin:0 0 6px}
.about p{margin:0;color:var(--ink-2);font-size:19px}
.chan{display:flex;flex-direction:column;gap:6px}
.chan a{font-family:var(--f-ui);font-size:14px;text-decoration:none;color:var(--lapis-ink)}
.chan a:hover{text-decoration:underline}

/* صفحة الصحابي */
.crumb{font-family:var(--f-ui);font-size:13px;color:var(--muted);padding-top:24px}
.crumb a{text-decoration:none;color:var(--lapis-ink)}
.head{padding-block:10px 28px;border-bottom:1px solid var(--rule)}
.head h1{font-family:var(--f-name);font-weight:400;font-size:clamp(52px,9vw,96px);line-height:1.1;margin:0}
.head .full{font-family:var(--f-ui);font-size:14px;color:var(--muted);margin:6px 0 0}
.head .q{font-size:clamp(26px,3.4vw,34px);color:var(--lapis-ink);margin:14px 0 0;line-height:1.4}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.tag{font-family:var(--f-ui);font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--lapis-soft);color:var(--lapis-ink);text-decoration:none}

.body{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:40px;padding-block:32px}
@media (max-width:900px){.body{grid-template-columns:1fr;gap:28px}}
.player{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:#0D1020}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:#F1EFE9;text-align:center;padding:16px;
  background:radial-gradient(130% 100% at 50% 30%,#22305E 0%,#0D1020 70%)}
.yt b{font-family:var(--f-name);font-weight:400;font-size:30px}
.yt small{font-family:var(--f-ui);font-size:13px;opacity:.7}
.play{width:62px;height:62px;border-radius:50%;background:#F1EFE9;position:relative;margin-bottom:8px;transition:transform .2s}
.play::after{content:"";position:absolute;inset:0;margin:auto;width:0;height:0;border-style:solid;border-width:11px 0 11px 18px;border-color:transparent transparent transparent #161A2A;transform:translateX(3px)}
.yt:hover .play{transform:scale(1.07)}
.nov{font-family:var(--f-ui);font-size:14px;color:#F1EFE9;opacity:.8}

.sum-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:30px 0 8px}
.sum-h h2{font-family:var(--f-text);font-weight:700;font-size:28px;margin:0}
.draft{font-family:var(--f-ui);font-size:12px;color:var(--warn);border:1px solid currentColor;border-radius:999px;padding:1px 9px}
.intro{font-size:23px;color:var(--ink-2);margin:0 0 18px;max-width:62ch}
.pts{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.pts li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--rule)}
.ts{font-family:var(--f-ui);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;direction:ltr;justify-self:start;color:var(--lapis-ink);background:var(--lapis-soft);border-radius:6px;padding:4px 8px;height:fit-content;margin-top:5px}
.ts:hover{background:var(--lapis);color:var(--sheet)}
.pts p{margin:0;font-size:21px;line-height:1.65;max-width:62ch}

.side{display:flex;flex-direction:column;gap:22px}
.box{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:20px 22px}
.box h3{font-family:var(--f-ui);font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px;letter-spacing:.03em}
.msg{font-size:26px;line-height:1.45;margin:0}
.axes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.axes li{border-inline-start:3px solid var(--rule);padding-inline-start:12px}
.axes b{font-family:var(--f-text);font-weight:700;font-size:21px;display:block}
.axes .src{font-family:var(--f-ui);font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:2px 0 6px}
.axes ul{margin:0;padding-inline-start:18px;font-size:19px;line-height:1.55;color:var(--ink-2)}
.g{font-family:var(--f-ui);font-size:11px;font-weight:600;padding:0 7px;border-radius:999px;border:1px solid currentColor}
.g.g{color:var(--ok)} .g.y{color:var(--warn)} .g.r{color:var(--bad)} .g.n{color:var(--note)}
.axes li.g-g{border-color:var(--ok)} .axes li.g-y{border-color:var(--warn)} .axes li.g-r{border-color:var(--bad)} .axes li.g-n{border-color:var(--note)}
.rel{display:flex;flex-direction:column}
.rel a{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);text-decoration:none}
.rel a:last-child{border-bottom:0}
.rel .n{font-family:var(--f-name);font-size:24px;line-height:1.3}
.rel .w{font-family:var(--f-ui);font-size:12px;color:var(--muted);align-self:center}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding-block:24px 8px;border-top:1px solid var(--rule)}
.pager a{text-decoration:none;display:flex;flex-direction:column}
.pager a:last-child{text-align:left}
.pager .n{font-family:var(--f-name);font-size:28px}

/* الخريطة */
.map-h{padding-block:28px 12px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:end}
.map-h h1{font-family:var(--f-name);font-weight:400;font-size:clamp(44px,7vw,72px);margin:0;line-height:1.1}
.map-h p{margin:4px 0 0;color:var(--ink-2);font-size:20px;max-width:46ch}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{font-family:var(--f-ui);font-size:14px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:8px 14px;min-width:0;width:220px}
.stage{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;overflow:hidden;position:relative}
#graph{display:block;width:100%;height:min(72vh,640px);touch-action:none}
@media (max-width:560px){#graph{height:480px}}
#graph text{pointer-events:none}
.n-comp circle{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6;cursor:pointer}
.n-comp text{font-family:var(--f-name);font-size:19px;fill:var(--ink)}
.n-comp.sel circle{fill:var(--lapis);stroke:var(--lapis)}
.n-tag text{font-family:var(--f-ui);font-size:11.5px;fill:var(--muted)}
.n-tag rect{fill:var(--paper);stroke:var(--rule);cursor:pointer}
.n-tag.k-event rect{stroke:var(--warn)} .n-tag.k-tribe rect{stroke:var(--note)} .n-tag.k-theme rect{stroke:var(--lapis)}
.link{stroke:var(--rule);stroke-width:1}
.link.hot{stroke:var(--lapis);stroke-width:1.8}
.dim{opacity:.15}
.peek{position:absolute;inset-block-end:14px;inset-inline-start:14px;max-width:min(360px,calc(100% - 28px));background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;box-shadow:0 8px 28px rgba(0,0,0,.08)}
.peek .n{font-family:var(--f-name);font-size:28px;line-height:1.2}
.peek p{margin:2px 0 8px;font-size:18px;color:var(--ink-2)}
.peek a{font-family:var(--f-ui);font-size:13px;color:var(--lapis-ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--f-ui);font-size:12.5px;color:var(--muted);padding:10px 2px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1.5px solid;margin-inline-end:5px;vertical-align:-2px}

footer{margin-top:48px;padding-block:20px 32px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:var(--f-ui);font-size:12.5px;color:var(--muted)}
footer .gl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.view{animation:in .35s ease both}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div class="wrap" dir="rtl" lang="ar">
  <header class="bar">
    <a class="mark" href="#home">مع الصحابة</a>
    <nav class="nav" aria-label="التنقل">
      <a href="#home" data-v="home">الحلقات</a>
      <a href="#map" data-v="map">الخريطة</a>
      <a href="#about" data-v="about">عن السلسلة</a>
    </nav>
  </header>
  <main id="view"></main>
  <footer>
    <div class="gl"><span>درجة الرواية:</span><span class="g g">صحيح أو حسن</span><span class="g y">سيرة أو رُوي</span><span class="g r">لا يثبت</span><span class="g n">كلام أهل العلم</span></div>
    <span>الأحكام منقولة عن أهل العلم والمحققين. الملخصات مكتوبة من كلام الحلقات.</span>
  </footer>
</div>
<script>window.NO_EMBED=true</script><script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script><script>
/* بيانات الموقع: كل درس جديد يُضاف كعنصر في LESSONS.
   links: معرّفات من TAGS. grade: "g" صحيح/حسن، "y" سيرة أو رُوي، "r" لا يثبت. */
window.TAGS = {
  uhud:    { label: "أحد", kind: "event" },
  badr:    { label: "بدر", kind: "event" },
  tabuk:   { label: "تبوك", kind: "event" },
  khandaq: { label: "الخندق", kind: "event" },
  aqaba:   { label: "العقبة", kind: "event" },
  khazraj: { label: "الخزرج", kind: "tribe" },
  aws:     { label: "الأوس", kind: "tribe" },
  salima:  { label: "بنو سلمة", kind: "tribe" },
  najjar:  { label: "بنو النجار", kind: "tribe" },
  muhajir: { label: "المهاجرون", kind: "tribe" },
  wafa:    { label: "الوفاء بالعهد", kind: "theme" },
  sidq:    { label: "الصدق", kind: "theme" },
  taswif:  { label: "التسويف", kind: "theme" },
  forsa:   { label: "الفرصة الفائتة", kind: "theme" },
  amana:   { label: "الأمانة", kind: "theme" },
  qiyada:  { label: "القيادة", kind: "theme" },
  bait:    { label: "الدعوة في البيت", kind: "theme" },
  ittiba:  { label: "الاتباع", kind: "theme" },
  quran:   { label: "القرآن", kind: "theme" },
  iffa:    { label: "العفة", kind: "theme" },
  dawa:    { label: "الدعوة", kind: "theme" },
  tadhiya: { label: "التضحية", kind: "theme" },
  rajee:   { label: "الرجيع", kind: "event" }
};

window.LESSONS = [
  {
    id: "abu-dujana",
    name: "أبو دجانة",
    full: "سماك بن خرشة الأنصاري",
    title: "«من يأخذ هذا السيف بحقه؟»",
    oneLine: "رجل سأل عن حق الفرصة قبل ما ياخدها، ثم وفّى به يوم أحد.",
    links: ["uhud", "khazraj", "wafa"],
    axes: [
      { t: "قصة السيف", g: "g", src: "مسلم ٢٤٧٠", f: ["اسأل عن حق الفرصة قبل ما تمد إيدك ليها", "الحماس من غير فهم بيضيّع الأمانة"] },
      { t: "مشهد أحد", g: "g", src: "البخاري ومسلم", f: ["الشجاعة قرار بيتاخد قبل المعركة", "الثبات وقت الانكسار هو الاختبار الحقيقي"] },
      { t: "ما لا يثبت", g: "r", src: "ابن إسحاق والواقدي", f: ["قصة التترس بالظهر لا تثبت", "الصدق في النقل جزء من الدين"] }
    ],
    message: "سيفك الأسبوع ده إيه؟ واكتب تحته: أنا آخذه بحقه.",
    summary: {"intro": "حلقة عن سماك بن خرشة، صاحب العصابة الحمراء، وسؤال واحد بيلف الحلقة كلها: كل باب في الدين ليه تمن، فإنت عارف حق اللي في إيدك؟", "points": [{"t": 186, "p": "كل قصة صحابي فيها تمن اتدفع. والبيعة مع الله بيعة على النفس والمال: ﴿إن الله اشترى من المؤمنين أنفسهم وأموالهم﴾، فاستبشر باللي سبته عشانه وما تحزنش عليه."}, {"t": 541, "p": "مشهد أحد: السبعة من الأنصار اللي قاموا واحد ورا التاني دفاعاً عن النبي ﷺ لحد ما استُشهدوا، ومحدش عارف أسماءهم. الدين مفيهوش أفيش وتتر، والله يعرفهم."}, {"t": 707, "p": "أبو دجانة هو سماك بن خرشة الأنصاري، وكان معروف إنه لما يلبس عصابته الحمراء يبقى عاهد على الموت."}, {"t": 1036, "p": "«من يأخذ مني هذا؟» فمدّوا أيديهم كلهم، ولما قال «فمن يأخذه بحقه؟» أحجم القوم. الحماس سهل، لكن التبعات هي اللي بتفرز."}, {"t": 1330, "p": "قال أبو دجانة «أنا آخذه بحقه»، فأخذه ففلق به هام المشركين."}, {"t": 1547, "p": "سيوف لها أخلاق: يُروى إن نفس السيف اللي فلق هام المشركين اتشال عن امرأة. وكمان اللسان سيف، فإياك تستعمله في أعراض المسلمين."}, {"t": 1760, "p": "«التلبّس بالفرض»: لو ربنا إداك علم أو قرآن أو منصب أو تأثير، ده سيفك، وما ينفعش تقعد بيه في بيتك."}, {"t": 2060, "p": "فيه أعمال لازم تسبق ليها، زي «سبقك بها عكاشة». والصحابة اللي ما مدّوش إيدهم ما كانش ضعف إيمان، لكن ربنا اختار للسيف ده صاحبه."}, {"t": 2315, "p": "مش كل السيوف سيوفك: فيه سيوف بتلمع زي الظهور على السوشيال ميديا وليها تمن من الإخلاص، وفيه سيوف خفية زي كفالة الأسر محدش يعرف عنها حاجة. ادعي لأخوك في سيفه، ودوّر على ثغرك."}, {"t": 2672, "p": "مشيته المتبخترة بين الصفّين، والاستعلاء بالإيمان على الكافر عبادة، لكن التكبّر على إخوانك مذموم."}, {"t": 2944, "p": "من عاش على شيء مات عليه: استُشهد يوم اليمامة. ولما سألوه عن أرجى عمله قال: كنت لا أتكلم فيما لا يعنيني، وكان قلبي للمسلمين سليماً."}], "status": "draft"},
    video: "fUyy6kxP560"
  },

    oneLine: "فاتته بدر، فقال جملة واحدة وقعد سنة يحضّر لها، واستُشهد يوم أحد.",

    ],
    message: "إنت بتحضّر لفرصتك الجاية، ولا مستني تيجي؟",
    summary: {"intro": "حلقة عن صحابي له مشهد واحد كبير، وكان في لحظة ظن فيها الناس إن النبي ﷺ قُتل. الفكرة اللي ماشية في الحلقة كلها: الفرصة اللي فاتتك تتحول لعهد مع الله، مش لجلد ذات.", "points": [{"t": 162, "p": "نسبه: خزرجي من بني النجار، أخوال عبد المطلب جد النبي ﷺ، وهو عم أنس بن مالك اللي اتسمّى على اسمه."}, {"t": 237, "p": "فيه مشاهد كبيرة لو فاتتك ممكن متتكررش: رمضان، حفظ القرآن، طلب العلم. وكلمة «أنا قادر عليه إذا أردت» هي نفسها اللي ضيّعت كعب بن مالك."}, {"t": 564, "p": "غاب عن بدر، فقال: «لئن أشهدني الله قتال المشركين ليرينّ الله ما أصنع». ومن أدبه إنه ما رضيش يزوّد على الجملة دي، لأنها عهد مع الله."}, {"t": 781, "p": "التقصير الصح بيولّد عزيمة، مش ولولة. والعلامة إنك تستعد فعلاً: ﴿ولو أرادوا الخروج لأعدّوا له عدة﴾."}, {"t": 1020, "p": "يوم أحد اعتذر لله عن إخوانه اللي قعدوا، وتبرّأ من فعل المشركين. التمس العذر للمسلمين وما شافش نفسه أحسن منهم، زي اللي قالوا في أصحاب السبت: ﴿معذرةً إلى ربكم﴾."}, {"t": 1696, "p": "«الجنة وربّ النضر، إني أجد ريحها دون أحد». من العلماء من قال إنه شمّها حقيقةً كرامةً له، ومعنى ابن بطال إن الجنة في موضع الجهاد تُكتسب وتُشترى."}, {"t": 1769, "p": "وجدوا فيه بضعاً وثمانين ضربة وطعنة ورمية، وما عرفته إلا أخته الربيّع ببنانه. وكان الصحابة يرون إن ﴿من المؤمنين رجالٌ صدقوا ما عاهدوا الله عليه﴾ نزلت فيه وفي أشباهه."}, {"t": 2300, "p": "قصة ثنيّة الربيّع: أقسم ألا تُكسر، فعفا القوم، وقال النبي ﷺ: «إنّ من عباد الله من لو أقسم على الله لأبرّه»."}, {"t": 2418, "p": "الرسالة: كل واحد فينا فاته باب طاعة أو انقطع عنه، يعقد مع الله عهد «ليرينّ الله ما أصنع»، من غير ما يستنى رمضان الجاي."}], "status": "draft"},

    oneLine: "سيد أعرج، ابنه هدم صنمه بحكمة، فأسلم ثم استُشهد في أحد مع ابنه خلّاد.",

    ],
    message: "اللي غلط في بيتك، غيّره بالقدوة قبل الكلام.",
    summary: {"intro": "حلقة عن بيت كامل أكتر منها عن صحابي واحد: سيد أعرج أسلم كبيراً، وكان معاه ألف عذر يقعد بيه، فرفض كل الأعذار وطلب الجنة بعرجته.", "points": [{"t": 196, "p": "عمرو بن الجموح من أشراف بني سلمة من الأنصار. لما نوّر مصعب بن عمير المدينة أسلم بيته كله، زوجته هند وأولاده، وفضل هو على صنمه."}, {"t": 368, "p": "كان عنده صنم خاص في البيت يعبده لوحده، ودي من الكِبر نفسه اللي خلّى الكفار يرفضوا دين يساوي بينهم وبين الفقير. أكرمكم عند الله أتقاكم."}, {"t": 680, "p": "كان بيطيّب صنمه ويقف قدامه منتصب على رجله السليمة تعظيماً له. والسؤال لينا: إحنا واقفين في صلاتنا قدام ملك الملوك بالخشوع ده؟"}, {"t": 862, "p": "معاذ ابنه ومعاذ بن جبل كانوا بيرموا الصنم في الحفرة كل ليلة، وهو يقوم يقول «أين إلهي؟». والدرس في العقيدة إن ربك لا تأخذه سنة ولا نوم، فأول حد يجي في بالك في الكرب هو الله."}, {"t": 1117, "p": "علّق في رقبة الصنم سيف وقاله «إن كان فيك خير فدافع عن نفسك»، فلقاه مربوط في كلب ميت. ساعتها عرف إنه لا يدفع عن نفسه، فكيف يدفع عنه؟"}, {"t": 1206, "p": "جلس يسمع من ابنه معاذ، فقرأ عليه الفاتحة فأسلم. الفاتحة اللي بنقرأها ١٧ مرة في اليوم، عملت فينا إيه؟"}, {"t": 1466, "p": "رسالة للأبناء: البرّ هو اللي بيفتح قلب الأب، والمصادمة بتقفله. ادعُ أهلك بالحكمة والموعظة الحسنة."}, {"t": 1536, "p": "معاذ بن عمرو كان من قتلة أبي جهل يوم بدر وهو غلام، وتربية أمه هند هي اللي عملت فيه القضية دي. ليس العبرة بمن سبق، العبرة بمن صدق."}, {"t": 1841, "p": "يوم بدر منعه عذره، ويوم أحد منعه أولاده، فاشتكاهم للنبي ﷺ وسأله: لو قُتلت أمشي برجلي دي صحيحة في الجنة؟ قال: «نعم»."}, {"t": 2154, "p": "بشّره النبي ﷺ إنه يطأ بعرجته الجنة، واستُشهد يوم أحد ومعاه ابنه خلّاد."}, {"t": 2260, "p": "الأعذار: كل واحد فينا بيطلع ١٠٠ عذر أول ما ييجي عمل في الدين، وهو عارف إنه مش معذور. «فرح المخلَّفون بمقعدهم»."}, {"t": 2511, "p": "«سيروا إلى الله عرجاً ومكاسير، فإن انتظار الصحة بطالة». متستناش الظروف تكمل، وارفع سقف التزامك عشان لما تقع تقع في حتة عالية."}, {"t": 2706, "p": "عرجتك هي ذنوبك وتقصيرك، فما تخليهاش تمنعك عن الله. قابله بيها، وحافظ على اللي فاضل من رجلك السليمة."}, {"t": 2776, "p": "دُفن مع صاحبه عبد الله بن عمرو بن حرام لأنهما كانا متحابّين، وفيه إشارة لشفاعة الإخوان في الآخرة."}], "status": "draft"},

  },

    message: "مكانتك النهارده، بتستخدمها لمين؟",
    summary: {"intro": "ست سنين بس في الإسلام، وفي آخرها اهتزّ العرش لموته. الحلقة كلها بتدور على سؤال واحد: إيه اللي كان في قلب سعد بن معاذ وخلّاه يوصل للمكانة دي؟", "points": [{"t": 88, "p": "الدين بيحاسب على المشاعر كمان: حب الصحابة ممكن يكون البوابة اللي تدخل منها الجنة، وكمان مجالس العلم اللي بتحفّها الملائكة."}, {"t": 335, "p": "أسلم وعنده حوالي ٣٠ سنة، ومات وعنده حوالي ٣٦، وقال النبي ﷺ إن العرش اهتز لموته. فالسؤال مش «عمل إيه؟»، السؤال «كان في قلبه إيه؟»"}, {"t": 420, "p": "فيه علاقة غيبية بين المؤمن وكل حاجة حواليه: الجذع بكى لما فارقه النبي ﷺ، وأحد جبل يحبنا ونحبه، والأرض بتشهد. طب المسجد عارفك؟ والملائكة عارفة اسمك؟"}, {"t": 756, "p": "مفتاح القصة هو الصدق: الصادق يصنع الله له، زي أهل الكهف والتلاتة اللي في الغار. ليس العبرة بمن سبق، العبرة بمن صدق."}, {"t": 893, "p": "قصة إسلامه: جاء لمصعب بحربته، فقاله «أوَتجلس فتسمع؟» فسمع القرآن وأسلم. الكلام اللي طالع من القلب بيوصل للقلب، فاشتغل على نفسك قبل ما تشتغل على الناس."}, {"t": 1525, "p": "رجع لقومه وقال: كلامكم عليّ حرام حتى تؤمنوا بالله ورسوله، فما بات في بني عبد الأشهل رجل ولا امرأة إلا أسلم. قومه قالوا عنه «سيدنا فضلاً وأيمننا نقيبة»، والأخلاق هي اللي خلّت كلمته تتسمع."}, {"t": 1580, "p": "لو ليك سلطان في بيتك أو شغلك، إنت مسؤول: غيّر بإيدك، فإن لم تستطع فبلسانك. وما يبقاش الدين عندك أهون من ماتش كورة."}, {"t": 1697, "p": "الفرق بينه وبين عبد الله بن أُبي: الاتنين سادة في المدينة، بس سعد تجرّد من الرياسة ودخل تحت راية النبي ﷺ، والتاني ما قبلش."}, {"t": 2000, "p": "يوم بدر: «امضِ يا رسول الله لما أردت… لو استعرضت بنا هذا البحر لخضناه معك». ده معنى البيعة، فإنت بايعت على إيه؟ (الكلمة دي منسوبة لسعد بن معاذ في السيرة، وفي صحيح مسلم لسعد بن عبادة)"}, {"t": 2453, "p": "العزة على الكافر في موقفه مع أبي جهل عند الكعبة: هدّده بقطع طريق تجارته للمدينة، لأنه عارف بيوجعه منين."}, {"t": 2804, "p": "في الخندق أُصيب في الأكحل، فدعا: «اللهم لا تُخرج نفسي حتى تُقرّ عيني من بني قريظة»، فاستمسك عرقه حتى حكم فيهم بحكم الله في الخونة."}, {"t": 3220, "p": "بعد وفاته: مناديل سعد في الجنة خير من جبة الديباج، واهتز العرش فرحاً بقدومه، وضمّة القبر لو نجا منها أحد لنجا منها سعد."}, {"t": 3468, "p": "الرسالة: الصدق في العمل، ولو العمر قصير."}], "status": "draft"},

    message: "الأمانة مش بتضيع مرة واحدة، بتضيع بالتدريج.",
    summary: {"intro": "حذيفة بن اليمان، فقيه الفتن وصاحب سرّ النبي ﷺ. الحلقة بتمشي على ملامح شخصيته واحدة واحدة، وبتوصل لمشهد ليلة الأحزاب.", "points": [{"t": 63, "p": "«كان الناس يسألون رسول الله ﷺ عن الخير، وكنت أسأله عن الشر مخافة أن يدركني». ده خوف إيجابي من الفتن: يتعلّم عشان ينجو، مش عشان يوسوس ويشك في الناس."}, {"t": 315, "p": "صاحب السر: النبي ﷺ أسرّ له بأسماء المنافقين، وعمر كان يسأله «أسمّاني رسول الله فيهم؟». المؤمن يرى ذنبه كجبل يخاف يقع عليه، والفاجر يراه ذبابة."}, {"t": 668, "p": "«وفيه دَخَن»: الخير بعد الشر مش هيبقى صافي. فبلاش ثقافة إلغاء المتابعة مع كل غلطة، اقبل من الناس اللي يتقبل وردّ اللي يترد، فالإنصاف عزيز."}, {"t": 1294, "p": "«دعاة على أبواب جهنم… من جلدتنا ويتكلمون بألسنتنا». الفتنة ممكن تيجيلك من شكل متدين، ومش هينجيك منها غير العلم."}, {"t": 1441, "p": "«تلزم جماعة المسلمين وإمامهم»، فإن لم يكن «فاعتزل تلك الفرق كلها». ابنِ فهمك للدين بناءً منهجي على أصوله، مش على دروس حماسية بس."}, {"t": 1688, "p": "«اقرأ كتاب الله واعمل بما فيه»: إحنا أكتر ناس عندهم معلومات وأقل ناس بيعملوا بيها. ومن كلامه: «من اتقى الشر وقع في الخير»."}, {"t": 2100, "p": "فقه الواقع: افهم اللي بيحصل حواليك. زيد بن ثابت اتعلم لغة اليهود بأمر النبي ﷺ، وما ينفعش المسلم يبقى غافل يستعمله عدوه وهو مش حاسس."}, {"t": 2534, "p": "ضبط النفس: أخذ عليه المشركون العهد قبل بدر فوفّى به. وفي أحد قتل المسلمون أباه خطأً وهو بينادي «أبي أبي»، فتصدّق بديته عليهم."}, {"t": 2879, "p": "تابعي قال: لو أدركنا النبي ﷺ لحملناه على أعناقنا. فرد حذيفة: «هوّن عليك يا ابن أخي». الحماس من غير تربية ممكن يهلك صاحبه، والدين يُوغَل فيه برفق."}, {"t": 3363, "p": "ليلة الأحزاب: برد وجوع وخوف، و«ألا رجل يأتيني بخبر القوم؟» فلم يجبه أحد، حتى دعاه باسمه فقام."}, {"t": 3765, "p": "مشى كأنه في حمّام دافي، وقدر يرمي أبا سفيان، فتذكّر «ولا تذعرهم عليّ» فما رماه. وفي ده درس في طاعة الأمر، وإن العمل للدين ليه شهوة في النفس."}, {"t": 4140, "p": "رجع فنام في طرف عباءة النبي ﷺ وهو يصلي، لحد ما أصبح فقال له: «قم يا نومان»."}, {"t": 4278, "p": "الزهد في مواجهة الدنيا: دخل المدائن أميراً على حمار وفي إيده خبز، فاحتضنه عمر."}, {"t": 4495, "p": "عند موته: «حبيب جاء على فاقة… الحمد لله الذي سبق بي الفتنة»، ومات بعد عثمان بأيام قبل ما الفتنة تبدأ."}], "status": "draft"},
    video: "eh5Id8mXVYo"
  },

  {"id": "ibn-masud", "name": "عبد الله بن مسعود", "full": "عبد الله بن مسعود الهذلي، أبو عبد الرحمن", "title": "«اقرأ عليّ»", "oneLine": "غلام راعي غنم رفعه القرآن حتى صار أعلم الصحابة بكتاب الله وأصل مدرسة الكوفة.", "links": ["badr", "uhud", "muhajir", "quran"], "axes": [{"t": "غلام معلَّم", "g": "y", "src": "مسند أحمد", "f": ["الأمانة سبقت الإسلام: «إني مؤتمن»", "اسأل تتعلّم: «علّمني من هذا»"]}, {"t": "صاحب السواد والسواك", "g": "g", "src": "البخاري", "f": ["الملازمة بتصنع الشبه", "السنة لازم تبان عليك"]}, {"t": "«اقرأ عليّ»", "g": "g", "src": "البخاري ومسلم", "f": ["القرآن يُقرأ بتدبّر مش بسرعة", "«حسبك» والعين تذرف"]}, {"t": "وصاياه في القرآن", "g": "y", "src": "آثار عن ابن مسعود", "f": ["«حرّكوا به القلوب»", "«ليس حفظ القرآن بحفظ الحروف ولكن بإقامة الحدود»"]}], "message": "اجعل وردك بالوقت مش بالصفحات، وحرّك بيه قلبك.", "video": "Jj6tEJMxdNM", "summary": {"intro": "حلقة عن صاحب القرآن: سادس ستة في الإسلام، وغلام راعي غنم رفعه القرآن لحد ما بقى أصل مدرسة فقه كاملة. «إن الله يرفع بهذا الكتاب أقواماً ويضع به آخرين».", "points": [{"t": 104, "p": "القدوات اللي الشباب متعلق بيها النهارده مش حقيقية. الصحابة هم الأبطال اللي المفروض نقتدي بيهم: «فإن آمنوا بمثل ما آمنتم به فقد اهتدوا»."}, {"t": 207, "p": "عبد الله بن مسعود، أبو عبد الرحمن الهذلي. من اشتغل بالقرآن ربنا يعطيه الدنيا قبل الآخرة، وابن تيمية ندم على عمر ضاع في غير معاني القرآن."}, {"t": 482, "p": "«لقد رأيتني سادس ستة ما على الأرض مسلم غيرنا». الصحابة طبقات، واللي سبق وبذل في مكة مش زي اللي أسلم بعد الفتح."}, {"t": 511, "p": "كان نحيف الساقين وضحك الصحابة منهما، فقال النبي ﷺ: «لهما أثقل في الميزان من أحد». ربنا لا ينظر إلى صوركم، ولكن إلى قلوبكم وأعمالكم."}, {"t": 637, "p": "قصة إسلامه: غلام يرعى غنم عقبة بن أبي معيط، قال «إني مؤتمن»، فمسح النبي ﷺ ضرع شاة ما تحلبش فدرّت. فقال: علّمني، فقال له النبي ﷺ: «إنك غلام معلَّم»."}, {"t": 782, "p": "«هذّاً كهذّ الشعر؟» قراءة القرآن مش استعراض وسرعة: «حرّكوا به القلوب»، والخشوع في الركوع والسجود."}, {"t": 932, "p": "صاحب السواد والسواك والنعلين: كان ملازم للنبي ﷺ لدرجة إن الصحابة ظنوه من أهل بيته، فبقى أشبه الناس به سمتاً وهدياً. والسنة اللي بتتعلمها لازم تبان عليك."}, {"t": 1357, "p": "أول من جهر بالقرآن في مكة بعد النبي ﷺ: قرأ الرحمن عند الكعبة وضربوه، وقال «لئن شئتم لأعاودنّهم بها غداً». حلاوة القرآن بتنسيك الألم."}, {"t": 1609, "p": "صلّى مع النبي ﷺ ليلة طويلة لحد ما همّ يقعد ويسيبه، وسمّى ده «أمر سوء». ده الأدب اللي وصّل الصحابة."}, {"t": 1878, "p": "«ما من آية إلا وأنا أعلم أين نزلت وفيمن نزلت». حفظ الحروف شيء، ومعرفة القرآن ومعانيه والعمل بيه شيء تاني."}, {"t": 2106, "p": "«استقرئوا القرآن من أربعة» وبدأ بيه. وسمع النبي ﷺ قراءته بالليل فقال «سل تُعطه»، وكان دعاؤه: «اللهم إني أسألك إيماناً لا يرتد، ونعيماً لا ينفد، وقرة عين لا تنقطع، ومرافقة محمد ﷺ في أعلى جنة الخلد»."}, {"t": 2187, "p": "«اقرأ عليّ»، فقرأ النساء حتى ﴿فكيف إذا جئنا من كل أمة بشهيد﴾ فقال «حسبك»، وعيناه ﷺ تذرفان."}, {"t": 2486, "p": "عمر أرسله للكوفة معلّماً وقال «آثرتكم به على نفسي». القرآن بيحفظ صاحبه: وقت الحفظ والمراجعة بيصرف عنك ذنوب ما بتحسش بيها غير لما تسيب الحفظ."}, {"t": 2736, "p": "كان شديد الخشية من الكذب على النبي ﷺ، فكان يرتعد لما يحدّث. ومن تلاميذه في الكوفة طلعت مدرسة الرأي اللي انتهت لأبي حنيفة."}, {"t": 2899, "p": "من وصاياه: «لا يكن همّ أحدكم آخر السورة»، فاخلي وردك بالوقت مش بالصفحات. و«ليس حفظ القرآن بحفظ الحروف ولكن بإقامة الحدود»، و«إن هذه القلوب أوعية فاشغلوها بالقرآن»."}], "status": "draft"}},
  {"id": "marthad", "name": "مرثد الغنوي", "full": "مرثد بن أبي مرثد الغنوي", "title": "«يا عناق، إن الله حرّم الزنا»", "oneLine": "حبّ في الجاهلية، ولما عرضت نفسها عليه بعد إسلامه قال كلمة واحدة، وصبر لله حتى استُشهد.", "links": ["rajee", "muhajir", "iffa", "sidq"], "axes": [{"t": "ليلة عناق", "g": "g", "src": "أبو داود والترمذي والنسائي، وحسّنه الترمذي", "f": ["الكلمة الصعبة في اللحظة الصعبة", "تذكّر إنك مسلم قبل أي حاجة"]}, {"t": "﴿الزاني لا ينكح إلا زانية﴾", "g": "g", "src": "نفس الحديث", "f": ["سأل ولم يكابر مشاعره", "وقف عند الأمر من غير جدال"]}, {"t": "علاج التعلّق", "g": "n", "src": "ابن تيمية وابن القيم", "f": ["القلب المملوء بحب الله ما يُبتلاش", "العفة والكتمان والصبر لله إحسان"]}], "message": "اقفل الباب قبل ما تفتحه، واملا قلبك بحاجة أكبر.", "video": "TjZTawBeSHE", "summary": {"intro": "حلقة طلعت من رسائل كتير جاية للقناة عن الحب والتعلّق. القصة عن صحابي مش مشهور، وروايته قصيرة، لكنها بتوريك إزاي صحابي حب بجد، وصبر لله على اللي في قلبه.", "points": [{"t": 62, "p": "رسائل كتير بتوصل من شباب وبنات حياتهم وقفت بسبب التعلّق. وده حاصل من أيام الشعراء اللي ماتوا عشقاً، والشريعة جت تضبطه، ومن غيرها الإنسان بيهلك."}, {"t": 293, "p": "على جنبتي الصراط أبواب عليها ستور مرخاة، وداعٍ يقول: «ويحك لا تفتحه، إنك إن تفتحه تلجه». الأغاني والصور ورا الستارة، وإنت محتاج بس متمدّش إيدك."}, {"t": 432, "p": "مرثد بن أبي مرثد الغنوي: رجل شديد، أسلم وهاجر، وكانت له في الجاهلية صاحبة اسمها عَناق. النبي ﷺ كلّفه يرجع مكة يهرّب المستضعفين الأسرى."}, {"t": 593, "p": "في ليلة مقمرة عرفته عناق من ظله وقالت: «هلمّ فبِت عندنا الليلة». فقال: «يا عناق، إن الله قد حرّم الزنا». دي أتقل كلمة ممكن تتقال في الموقف ده، زي صاحب الغار اللي قام عنها وهي أحب الناس إليه."}, {"t": 905, "p": "صرخت وطلع وراه تمانية، فدخل غار والرجال فوق راسه وأعماهم الله عنه. ورجع بعد كده للأسير وشاله بقيوده لحد ما وصّله."}, {"t": 1012, "p": "القلب الفاضي بيتبع هواه. لما تشيل هم أكبر، دين وأمة وقرآن، مش هيفضل مكان للغلط: «ما جعل الله لرجل من قلبين في جوفه»."}, {"t": 1265, "p": "رجع وسأل النبي ﷺ يتزوجها، وما تكبّرش على اللي في قلبه، فنزلت ﴿الزاني لا ينكح إلا زانية أو مشركة﴾ فقال له: «لا تنكحها»، فوقف عند الأمر."}, {"t": 1525, "p": "انكبّ على القرآن، وكان من أصحاب سرية الرجيع اللي خرجت تعلّم الناس، واستُشهد فيها وحبها في قلبه. لو كان قال «أيوه» الليلة دي، كان باقي حياته هيبقى شكله إيه؟"}, {"t": 1611, "p": "الشيطان صبور ومش بييأس: بيبدأ بنظرة أو متابعة حساب على إنستجرام وممكن ينتهي بالفاحشة. وابن مفلح بيقول: العين ترى غير المقدور عليه على غير ما هو عليه."}, {"t": 1950, "p": "ابن تيمية: القلب اللي يحب الله وحده ما يُبتلاش بالعشق أصلاً، زي يوسف عليه السلام. واللي ابتُلي فعفّ وكتم وصبر لله، فهو من المحسنين."}, {"t": 2213, "p": "النبي ﷺ ما كانش بيستخف بمشاعر المحبين: شفع لمغيث عند بريرة، وقال «لم يُرَ للمتحابين مثل النكاح»."}, {"t": 2335, "p": "علاج ابن القيم: اعرف إن التعلّق بالمستحيل نوع من الجنون، وشوف مفاسده على دينك ودنياك، وفي الآخر اصدق في اللجوء لمن يجيب المضطر إذا دعاه."}, {"t": 2490, "p": "الحل الأوسع إنك تملا قلبك بحب الله ورسوله والصحابة، وتتجوز لو قدرت، فالزواج ممكن يبقى فرض عين على اللي مبتلى. والعصمة من الفاحشة رزق من الله فاسأله إياها."}], "status": "draft"}},
  {"id": "musab", "name": "مصعب بن عمير", "full": "مصعب بن عمير بن هاشم العبدري القرشي", "title": "فتى مكة المدلل وسفير الإسلام", "oneLine": "ترك أنعم عيش في مكة، فكان أول سفير للإسلام في المدينة، ومات وما وجدوا له كفناً.", "links": ["uhud", "badr", "aqaba", "muhajir", "dawa", "tadhiya"], "axes": [{"t": "ترك النعيم", "g": "y", "src": "طبقات ابن سعد", "f": ["الحاجة اللي بتيجي بمشقة بتتمسك بيها", "التربية قبل المعلومة"]}, {"t": "سفير المدينة", "g": "y", "src": "سيرة ابن إسحاق", "f": ["«أوَتجلس فتسمع؟»", "اصدق الله في دعوتك"]}, {"t": "«إنه أخي دونك»", "g": "y", "src": "سيرة ابن هشام", "f": ["رابطة الدين فوق رابطة الدم", "الولاء والبراء في جملة"]}, {"t": "النمرة يوم أحد", "g": "g", "src": "البخاري", "f": ["ما أخدش من الدنيا حاجة", "من عاش على شيء مات عليه"]}], "message": "اعمل لنفسك مشروع دعوة على قدرك، واترك حاجة من الدنيا لله.", "video": "FGxaWmmcIYk", "summary": {"intro": "فتى مكة المدلل اللي بقى أول سفير للإسلام، ومات وما لقوش كفن يغطيه. الحلقة بتسأل: إيه اللي ذاقه مصعب وإحنا ما ذقناهوش؟", "points": [{"t": 17, "p": "ليه بندرس الصحابة؟ الفتن زادت، وفيه ناس بتغلو فيهم وناس بتسبّهم. محبتهم والاقتداء بيهم هو الطريق الوسط اللي يقرّبك من السنة."}, {"t": 297, "p": "سيرته قصيرة وأثره ضخم، لأن الدين دين عمل مش جدال: ﴿ولو أنهم فعلوا ما يوعظون به لكان خيراً لهم﴾. وإحنا قاعدين في مصر بسبب ناس اتحركت بالدين."}, {"t": 465, "p": "كان أنعم فتيان مكة: أغلى لبس وأطيب عطر، والطريق يعرف إنه عدّى منه. والترف بييسّر المعصية ويخلّي النفس ضعيفة."}, {"t": 630, "p": "العجب مش في إنه اتغيّر، العجب في اللي ذاقه في دار الأرقم وخلّاه يسيب ده كله. المعلومات اللي عندنا أكتر من اللي كانت عند سمية، فالفرق في التربية مش في المعلومة."}, {"t": 897, "p": "أول ابتلاء كان إنه يترك النعيم: أمه خنّاس هددته تسحب منه كل حاجة. والفتن بتتعرض على القلوب عوداً عوداً، زي اللي بيختار زوجة أو شغل على حساب دينه."}, {"t": 1335, "p": "حلاوة الإيمان في التلات اللي في الحديث: الله ورسوله أحب إليك مما سواهما، وتحب المرء لله، وتكره الرجوع لحياتك القديمة. ودمعة واحدة على السجادة ممكن تعيش عليها عشرين سنة."}, {"t": 1645, "p": "أمه قعدت في الشمس تضغط عليه، وهو يقول لها: «يا أمّه قولي لا إله إلا الله»، وما بدّل ولا غيّر."}, {"t": 1761, "p": "بعد العقبة اختاره النبي ﷺ يروح المدينة يعلّم الناس. الناس كإبل مائة لا تكاد تجد فيها راحلة، ومصعب كان الراحلة."}, {"t": 1876, "p": "أسيد بن حضير جه بحربته يشتم، فقاله مصعب: «أوَتجلس فتسمع؟». وكلمة أسعد بن زرارة: «اصدق الله فيه». الكلام اللي من القلب يوصل للقلب، والحرص على الشهرة بيفترس الدين زي ذئبين جائعين في غنم."}, {"t": 2360, "p": "أسلم أسيد ثم سعد بن معاذ وقومه كلهم في يوم، وده كله في ميزان مصعب، لحد ما ما بقاش بيت في المدينة إلا دخله الإسلام."}, {"t": 2833, "p": "يوم بدر شاف أخوه أبا عزيز أسيراً فقال للصحابي: «اشدد وثاقه فإن أمه ذات مال»، ولما عاتبه أخوه قال: «إنه أخي دونك». ده معنى الولاء والبراء."}, {"t": 3059, "p": "حمل اللواء يوم أحد وهو عارف إن حامل الراية ميت لا محالة، فقُطعت يمينه فحمله بشماله، حتى استُشهد."}, {"t": 3279, "p": "ما لقوا له غير نمرة: لو غطوا راسه بانت رجليه، فغطوا رجليه بالإذخر. ما أخدش من الدنيا حاجة عشان ياخد أجره كامل يوم القيامة."}, {"t": 3446, "p": "الرسالة: ما تقدّمش على الله ورسوله حاجة، واعمل لنفسك مشروع دعوة على قدرك، في بيتك أو شغلك أو مسجدك. وخد واجب عملي إنك تتخلى عن حاجة واحدة بتحبها من الدنيا."}], "status": "draft"}}

</script><script>

const ar = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);

const yt = (id, t) => `https://www.youtube.com/watch?v=${encodeURIComponent(id)}${t ? "&t=" + t + "s" : ""}`;

const group = l => l.links.includes("khazraj") || l.links.includes("aws") ? "ansar" : l.links.includes("muhajir") ? "muhajir" : "other";

  </section>`;
}

/* ---------- صفحة الصحابي ---------- */
function related(l){
  return L.filter(o => o.id !== l.id).map(o => ({o, s: o.links.filter(k => l.links.includes(k))})).filter(x => x.s.length).sort((a,b) => b.s.length - a.s.length).slice(0,5);
}
function playerHTML(l, t){

  if (window.NO_EMBED) return `<a class="yt" href="${yt(l.video, t)}" target="_blank" rel="noopener"><span class="play" aria-hidden="true"></span><b>شاهد الحلقة${t ? " من " + fmtT(t) : ""}</b><small>تفتح على يوتيوب</small></a>`;
  return `<iframe src="https://www.youtube-nocookie.com/embed/${esc(l.video)}?rel=0${t ? "&autoplay=1&start=" + t : ""}" title="${esc(l.name)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
}
function companion(l){
  const i = list.indexOf(l), prev = list[i-1], next = list[i+1], s = l.summary;
  view.innerHTML = `<div class="view">

  <section class="head"><h1>${esc(l.name)}</h1><p class="full">${esc(l.full)}</p><p class="q">${esc(l.title)}</p>
    <div class="tags">${l.links.map(k => `<a class="tag" href="#map" data-tag="${k}">${esc(T[k].label)}</a>`).join("")}</div></section>
  <section class="body">
    <div>
      <div class="player" id="player">${playerHTML(l, 0)}</div>
      <div class="sum-h"><h2>${s ? "ملخص الحلقة" : "عن الدرس"}</h2>${s && s.status === "draft" ? `<span class="draft">مسودة للمراجعة</span>` : ""}</div>
      ${s ? `<p class="intro">${esc(s.intro)}</p>
        <ol class="pts">${s.points.map(p => `<li><button class="ts" data-t="${p.t}" aria-label="شغّل من ${fmtT(p.t)}">${fmtT(p.t)}</button><p>${esc(p.p)}</p></li>`).join("")}</ol>`
        : `<p class="intro">${esc(l.oneLine)}</p>`}
    </div>
    <aside class="side">
      <div class="box"><h3>رسالة الدرس</h3><p class="msg">${esc(l.message)}</p></div>
      <div class="box"><h3>محاور الدرس</h3><ul class="axes">${l.axes.map(a => `<li class="g-${a.g}"><b>${esc(a.t)}</b><span class="src"><span class="g ${a.g}">${gradeName[a.g]}</span>${esc(a.src)}</span><ul>${a.f.map(f => `<li>${esc(f)}</li>`).join("")}</ul></li>`).join("")}</ul></div>
      ${related(l).length ? `<div class="box"><h3>صحابة يجمعهم بيه باب</h3><div class="rel">${related(l).map(x => `<a href="#${x.o.id}"><span class="n">${esc(x.o.name)}</span><span class="w">${x.s.map(k => esc(T[k].label)).join(" · ")}</span></a>`).join("")}</div></div>` : ""}
    </aside>
  </section>
  <nav class="pager" aria-label="الحلقات المجاورة">
    ${prev ? `<a href="#${prev.id}"><span class="eyebrow">السابقة</span><span class="n">${esc(prev.name)}</span></a>` : "<span></span>"}
    ${next ? `<a href="#${next.id}"><span class="eyebrow">التالية</span><span class="n">${esc(next.name)}</span></a>` : "<span></span>"}
  </nav></div>`;
  view.querySelectorAll(".ts").forEach(b => b.onclick = () => {
    const t = +b.dataset.t;
    document.getElementById("player").innerHTML = playerHTML(l, t);
    if (window.NO_EMBED) window.open(yt(l.video, t), "_blank", "noopener");
    else document.getElementById("player").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" });

  view.querySelectorAll("[data-tag]").forEach(a => a.onclick = () => { pendingTag = "t:" + a.dataset.tag; });

/* ---------- الخريطة ---------- */
let pendingTag = null;
function mapView(){
  view.innerHTML = `<div class="view">
  <section class="map-h"><div><h1>الخريطة</h1><p>كل صحابي متوصل بالغزوات والقبائل والمعاني اللي اتكلمنا عنها. دوس على أي نقطة تشوف مين اجتمعوا فيها.</p></div>
    <div class="tools"><input class="search" id="q" type="search" placeholder="ابحث عن صحابي أو معنى" aria-label="بحث">
      ${[["event","الغزوات"],["tribe","القبائل"],["theme","المعاني"]].map(([k,t]) => `<button class="pill" data-k="${k}" aria-pressed="true">${t}</button>`).join("")}</div></section>
  <div class="stage"><svg id="graph" role="img" aria-label="شبكة الصحابة"></svg><div class="peek" id="peek" hidden></div></div>
  <div class="legend"><span><i style="border-color:var(--warn)"></i>غزوة</span><span><i style="border-color:var(--note)"></i>قبيلة</span><span><i style="border-color:var(--lapis)"></i>معنى</span></div>
  </div>`;
  drawGraph();
}
function drawGraph(){
  const svg = d3.select("#graph"), show = {event:true, tribe:true, theme:true};
  const used = new Set(L.flatMap(l => l.links));
  const nodes = [...L.map(l => ({id:l.id, type:"comp", label:l.name})), ...[...used].map(k => ({id:"t:"+k, type:"tag", kind:T[k].kind, label:T[k].label}))];
  const links = L.flatMap(l => l.links.map(k => ({source:l.id, target:"t:"+k})));
  const nbr = new Map(nodes.map(n => [n.id, new Set()]));
  links.forEach(e => { nbr.get(e.source).add(e.target); nbr.get(e.target).add(e.source); });
  const g = svg.append("g");
  const ls = g.append("g").selectAll("line").data(links).join("line").attr("class","link");
  const ns = g.append("g").selectAll("g").data(nodes).join("g")
    .attr("class", d => d.type === "comp" ? "n-comp" : "n-tag k-" + d.kind).attr("tabindex",0).attr("role","button").attr("aria-label", d => d.label);
  ns.filter(d => d.type==="comp").append("circle").attr("r",7);
  ns.filter(d => d.type==="comp").append("text").attr("text-anchor","middle").attr("dy",-14).text(d => d.label).each(function(d){ d.tw = this.getComputedTextLength(); });
  const tg = ns.filter(d => d.type==="tag");
  tg.append("rect").attr("rx",9);
  tg.append("text").attr("text-anchor","middle").attr("dy",4).text(d => d.label);
  tg.each(function(d){ const w = this.querySelector("text").getComputedTextLength() + 16; d.w = w; d3.select(this).select("rect").attr("x",-w/2).attr("y",-10).attr("width",w).attr("height",20); });
  let W = 800, H = 600;
  if (sim) sim.stop();
  sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(80).strength(.5))
    .force("charge", d3.forceManyBody().strength(d => d.type==="comp" ? -420 : -160))
    .force("collide", d3.forceCollide(d => d.type==="comp" ? Math.max(30,(d.tw||60)/2+8) : (d.w||60)/2+6).iterations(2))
    .force("x", d3.forceX(() => W/2).strength(.05)).force("y", d3.forceY(() => H/2).strength(.08))
    .on("tick", () => {
      nodes.forEach(d => { const px = d.type==="comp" ? Math.max(36,(d.tw||60)/2+4) : (d.w||60)/2+4; d.x = Math.max(px, Math.min(W-px, d.x)); d.y = Math.max(30, Math.min(H-16, d.y)); });
      ls.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
      ns.attr("transform", d => `translate(${d.x},${d.y})`);
    });
  const size = () => { const r = svg.node().getBoundingClientRect(); W = r.width||800; H = r.height||600; svg.attr("viewBox",`0 0 ${W} ${H}`); sim.force("x").x(W/2); sim.force("y").y(H/2); sim.alpha(.6).restart(); };
  size(); window.onresize = size;
  if (reduce) { for (let i=0;i<300;i++) sim.tick(); sim.stop(); }
  ns.call(d3.drag().on("start",(e,d)=>{ if(!e.active) sim.alphaTarget(.2).restart(); d.fx=d.x; d.fy=d.y; }).on("drag",(e,d)=>{ d.fx=e.x; d.fy=e.y; }).on("end",(e,d)=>{ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));
  let hub = null; const peek = document.getElementById("peek");
  function paint(){
    const near = hub ? nbr.get(hub) : null;
    ns.style("display", d => d.type==="comp" || show[d.kind] ? null : "none").classed("sel", d => d.id===hub).classed("dim", d => near ? !(d.id===hub || near.has(d.id)) : false);
    ls.style("display", d => show[d.target.kind] ? null : "none").classed("hot", d => hub && (d.source.id===hub || d.target.id===hub)).classed("dim", d => hub ? !(d.source.id===hub || d.target.id===hub) : false);
    if (!hub) { peek.hidden = true; return; }
    peek.hidden = false;
    if (hub.startsWith("t:")) { const k = hub.slice(2), ms = L.filter(l => l.links.includes(k));
      peek.innerHTML = `<span class="eyebrow">${{event:"غزوة",tribe:"قبيلة",theme:"معنى"}[T[k].kind]}</span><div class="n">${esc(T[k].label)}</div><p>${ms.map(m => `<a href="#${m.id}">${esc(m.name)}</a>`).join(" · ")}</p>`; }
    else { const l = byId[hub]; peek.innerHTML = `<div class="n">${esc(l.name)}</div><p>${esc(l.title)}</p><a href="#${l.id}">افتح الحلقة ←</a>`; }
  }
  const act = d => { hub = hub === d.id ? null : d.id; paint(); };
  ns.on("click",(e,d)=>act(d)).on("keydown",(e,d)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); act(d); } });
  document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { const k = b.dataset.k; show[k] = !show[k]; b.setAttribute("aria-pressed", show[k]); paint(); });
  document.getElementById("q").oninput = e => { const v = e.target.value.trim(); const hit = v && nodes.find(n => n.label.includes(v)); hub = hit ? hit.id : null; paint(); };
  if (pendingTag && nbr.has(pendingTag)) { hub = pendingTag; pendingTag = null; }
  paint();
}

/* ---------- عن السلسلة ---------- */
function about(){ view.innerHTML = `<div class="view">${aboutHTML()}</div>`; }

/* ---------- التوجيه ---------- */
function route(){
  const h = location.hash.slice(1) || "home";
  if (byId[h]) { setNav(""); companion(byId[h]); }
  else if (h === "map") { setNav("map"); mapView(); }
  else if (h === "about") { setNav("about"); about(); }
  else { setNav("home"); home(); }
  window.scrollTo({ top: 0, behavior: "auto" });
}
window.addEventListener("hashchange", route);
route();
})();
</script>
