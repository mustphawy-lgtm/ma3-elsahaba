المجلس التاني عن عثمان: الإنفاق في سبيل الله كمقام إيماني عالٍ، وتجهيز جيش العسرة، وجمع الناس على مصحف واحد، والفتوح في خلافته، ثم الفتنة وشبهات الخوارج، وحصاره واستشهاده.", "points": [{"t": 95, "p": "الفتن في الشوارع والكافيهات كتير، فمين هيرجّع الناس دي للمسجد؟ و«ما اجتمع قوم في بيت من بيوت الله يتلون كتاب الله ويتدارسونه بينهم إلا نزلت عليهم السكينة وغشيتهم الرحمة»."}, {"t": 330, "p": "بئر رومة: النبي ﷺ عرض على صاحبها عيناً في الجنة فرفض، فاشتراها عثمان. وزي أبي الدحداح: «كم من عِذق رداح لأبي الدحداح في الجنة»."}, {"t": 436, "p": "سورة الحديد بتبدأ بالتسبيح ومعرفة الله قبل ﴿وأنفقوا مما جعلكم مستخلفين فيه﴾، لأنك لما تعرف الله الغني الحميد يسهل عليك تتخلى عن الدنيا. وعائشة قالت: تعلّمنا الإيمان ثم تعلّمنا القرآن."}, {"t": 523, "p": "الذنوب بتمنع العلم وبتحرمك من الطاعة: ﴿واعلموا أن الله يحول بين المرء وقلبه﴾. وفي مقامات في الدين محتاجة زاد إيماني، وأعلاها الصدقة."}, {"t": 690, "p": "﴿وأنفقوا في سبيل الله ولا تلقوا بأيديكم إلى التهلكة﴾: اللي ما بيخرّجش فلوس وقت ما الأمة محتاجة بيلقي بنفسه للتهلكة، لأن الجيش ما بيتجهّزش. و«والله ما الفقر أخشى عليكم، ولكن أخشى أن تُبسط عليكم الدنيا فتنافسوها»."}, {"t": 873, "p": "﴿لا يستوي منكم من أنفق من قبل الفتح وقاتل﴾. والإنفاق وقت الاستضعاف غير وقت الرخاء، زي غزوة تبوك والثمار طابت."}, {"t": 962, "p": "«المؤمن في ظل صدقته يوم القيامة». يوم الشمس تدنو من الرؤوس تلاقي فوقك ظل صدقتك، والبقرة وآل عمران، وظل العرش."}, {"t": 1100, "p": "﴿من ذا الذي يقرض الله قرضاً حسناً﴾: ربنا بيقترض منك، ويربّي صدقتك كما يربي أحدكم فلوّه حتى تكون مثل أُحد."}, {"t": 1210, "p": "جيش العسرة: قام عثمان مرة بعد مرة: عليّ مائة بعير بأحلاسها وأقتابها، ثم مائتان، ثم ثلاثمائة. فنزل النبي ﷺ وهو يقول: «ما ضرّ عثمان ما عمل بعد اليوم». وفرحة النبي ﷺ بيه هي أكتر ما يؤثّر في المشهد."}, {"t": 1427, "p": "«سبق درهم مائة ألف درهم». أبو بكر جاب كل ماله، والشاب اللي يطلّع مصروفه ويحرم نفسه من خروجة له لذة كأنه طلّع ملايين."}, {"t": 1543, "p": "عثمان بُشّر بالجنة أكتر من مرة. والأربعة الخلفاء ماتوا وما خدوش من الدنيا حاجة وكانوا من أغنى قريش: ﴿إن الله اشترى من المؤمنين أنفسهم وأموالهم بأن لهم الجنة﴾."}, {"t": 1655, "p": "وقف بئر رومة لسه لحد النهارده مزرعة فيها آلاف النخل، وفنادق في المدينة مكتوب عليها وقف عثمان بن عفان. صدق مع الله فاستمر أجره ١٤٠٠ سنة."}, {"t": 1794, "p": "جمع الناس على القرآن: أبو بكر جمع القرآن في مصحف، وعثمان جمع الناس على مصحف واحد لما اختلفوا في الأمصار، فبعت نسخ للأمصار. وده كان من شبهات الخوارج: «أحرق المصحف»."}, {"t": 1987, "p": "خلافته ١٢ سنة، وهو أكبر الخلفاء سناً. فتح أرمينية وقبرص وطرابلس الشام والنوبة، وأول أسطول بحري للمسلمين بإشارة معاوية، وما أجبر حد يركب البحر، ومعاوية ركب بأهله. وانتصروا في ذات الصواري."}, {"t": 2180, "p": "لما كثر المال وبعدت الأمصار خف الدين في الأطراف، فطلع عبد الله بن سبأ اليهودي بكتب مزوّرة وشبهات. «تلك أمة قد خلت»، والصحابة لن يبلغ أحد مدّ أحدهم ولا نصيفه، فما تسمعش الطعن فيهم واسأل أهل العلم."}, {"t": 2490, "p": "إسأل المتخصص في كل فن. وكلما زاد علم الرجل زاد سكوته، واجعل لك ورداً من «لا أدري»، و«من تتبّع عورة أخيه تتبّع الله عورته»."}, {"t": 2760, "p": "شبهة تولية الأقارب: ولّى ٢١ والياً، منهم خمسة من بني عبد شمس، ومعاوية كان والي عمر من قبل. وعبد الله بن أبي السرح ارتد ثم أسلم وحسن إسلامه وجاهد، والتائب ينفع يتقدّم."}, {"t": 3110, "p": "قالوا: زاد في الحمى، فقال: عمر زاد قبلي، ولكنكم كنتم تهابون عمر. و«لا يأتي على الناس زمان إلا والذي بعده شر منه». وأتمّ الصلاة في منى خوفاً على حديثي العهد بالإسلام، وزاد الأذان الأول للجمعة، وده اجتهاد خليفة راشد: «عليكم بسنتي وسنة الخلفاء الراشدين»."}, {"t": 3600, "p": "أبو ذر كان يرى إن كل مال زايد عن الحاجة لازم يتخرّج، بخلاف إجماع الصحابة، فاتجمّع عليه الناس في الشام. فلما استدعاه عثمان قال: إن شئت تنحّيت، فنزل الربذة سمعاً وطاعة."}, {"t": 3849, "p": "سنة ٣٥ هـ جت أحزاب الفتنة من مصر والكوفة والبصرة بكتب مزوّرة على لسان علي وابن مسعود، وحاصروا داره حوالي أربعين يوماً يطلبوا يخلع نفسه، ومنعوه الماء. «نكسّر الأول وبعدين نشوف مين يبني» هو منهج الخوارج."}, {"t": 3992, "p": "أشرف عليهم: أنشدكم الله، هل تعلمون أني اشتريت بئر رومة وأنتم اليوم تمنعوني الشرب منها؟ ووسّعت المسجد وأنتم تمنعوني أصلي فيه؟ و«اسكن ثبير، فإنما عليك نبي وصديق وشهيدان»، فقال: شهدوا لي ورب الكعبة أني شهيد."}, {"t": 4137, "p": "«إن الله مقمّصك قميصاً، فإن أرادك المنافقون على خلعه فلا تخلعه». فما خلعهوش عشان ما تبقاش الخلافة لعبة. واليهود همّهم التحريش بين المسلمين: «إن الشيطان قد أيس أن يعبده المصلّون في جزيرة العرب، ولكن في التحريش بينهم»."}, {"t": 4474, "p": "ليه الصحابة ما دافعوش عنه؟ كانوا ٧٠٠ قدام آلاف، وعثمان نفسه قال: من كان لي في عنقه بيعة فليغمد سيفه، وقال لعبيده: من أغمد سيفه فهو حر. ما رضيش يُراق بسببه دم مسلم."}, {"t": 4617, "p": "رأى النبي ﷺ في المنام يقول له: «أفطر عندنا غداً»، فأصبح صائماً. شدّ عليه إزاره من حيائه، ودخلوا عليه وهو يقرأ القرآن، فطُعن ووقع دمه على ﴿فسيكفيكهم الله وهو السميع العليم﴾."}, {"t": 4840, "p": "«المرء مع من أحب». قال أنس: فأنا أحب أبا بكر وعمر وعثمان وعلياً وأرجو أن أُحشر معهم، وإن لم أعمل بأعمالهم."}], "status": "draft"}], "ten": true, "video": "34H7HIx3_gs", "summary": {"intro": "المجلس الأول عن عثمان بن عفان: شكله ونسبه، وأخلاقه قبل الإسلام، وقصة إسلامه، وزواجه بابنتي النبي ﷺ، وإنفاقه، ثم الصفة اللي اتعرف بيها: الحياء.", "points": [{"t": 90, "p": "الهدف من السلسلة إنك تحب الصحابة لدرجة إنك تتخلّق بأخلاقهم، زي ما اللي بيحب لاعب كورة بيجمع عنه كل حاجة. وعلاقتك بالقرآن ممكن توصل إنه يجيلك يوم القيامة يقول: أنا صاحبك."}, {"t": 315, "p": "أشهر صفة فيه الحياء. وكان جميلاً حتى في السبعين، ولقوه نايم في المسجد متوسد حذاءه وهو خليفة. وكان غنياً جداً، والمال الصالح نعم للرجل الصالح."}, {"t": 453, "p": "لُقّب ذا النورين لأنه تزوج ابنتي النبي ﷺ رقية ثم أم كلثوم، وقالوا ما تزوج رجل ابنتي نبي غيره. وهو صاحب الهجرتين."}, {"t": 581, "p": "من السابقين الأولين، أسلم على يد أبي بكر. والداعي ما يعرفش قيمة اللي عمله إلا يوم القيامة: كلمة قلتها أو لينك بعتّه ممكن يكون لبنة في إيمان حد. والمدار على الإخلاص، وإلا يبقى من أول من تُسعّر بهم النار."}, {"t": 753, "p": "نسبه: عثمان بن عفان بن أبي العاص بن أمية بن عبد شمس بن عبد مناف، يلتقي مع النبي ﷺ في عبد مناف. اتولد بعد عام الفيل بست سنين، واستُخلف سنة ٢٤ هـ اتناشر سنة، واستُشهد عن ٨٢ سنة."}, {"t": 843, "p": "كان أحب قريش لقريش، ولذلك بعته النبي ﷺ لقريش في الحديبية بدل عمر. وكانت الأمهات تغني لأولادها: أحبك والرحمن حب قريش عثمان. وأمه أروى أسلمت، وجدته البيضاء عمة النبي ﷺ."}, {"t": 928, "p": "ما زنى في جاهلية ولا إسلام، ولا سجد لصنم، ولا شرب خمر. «خيارهم في الجاهلية خيارهم في الإسلام إذا فقهوا»، وأخلاقه قبل الإسلام كانت سبب إسلامه."}, {"t": 1013, "p": "قال: «اختبأت عند ربي عشراً»: إني لرابع أربعة في الإسلام، وما تغنّيت ولا تمنّيت، ولا مسست ذكري بيميني منذ بايعت بها رسول الله ﷺ، ولا مرّت بي جمعة منذ أسلمت إلا وأنا أعتق فيها رقبة."}, {"t": 1057, "p": "إيه اللي اتغير فيك بعد التزامك؟ لازم الناس تلاحظ: مش بس الهيئة، كمان وقتك وصحبتك وأعمالك. واعمل لنفسك خبيئة بينك وبين الله زي أصحاب الصخرة."}, {"t": 1281, "p": "يُروى إنه شاف رؤيا، وخالته سعدى قالت له: محمد بن عبد الله جاء من عند الله ليهديك إلى الله. ودور الأم والأخت والزوجة في الدعوة كبير: أم سليم مهرها كان إسلام أبي طلحة."}, {"t": 1533, "p": "راح لأبي بكر فقال: هذه الأوثان أليست حجارة صمّاء لا تسمع ولا تبصر؟ ثم قال له النبي ﷺ: «يا عثمان، أجب الله إلى جنته، فإني رسول الله إليك وإلى جميع خلقه». خاطب عمر بالشدة وعثمان باللين."}, {"t": 1792, "p": "عمه الحكم ربطه وقال: أترغب عن ملة آبائك؟ فقال: والله لا أدعه أبداً. ممكن تقع في معصية، لكن إياك الشيطان يخليك تسيب الدين بسببها."}, {"t": 1925, "p": "«أرحم أمتي بأمتي أبو بكر، وأشدهم في أمر الله عمر، وأصدقهم حياءً عثمان». والحياء في النساء آكد، وعند الرجال منقبة يحبها الله."}, {"t": 2084, "p": "عتبة وعتيبة ابنا أبي لهب طلّقا بنات النبي ﷺ قبل الدخول، فتزوج عثمان رقية. ومرضت يوم بدر فبقي يمرّضها بأمر النبي ﷺ، ثم زوّجه أم كلثوم، ولما ماتت قال: «لو كانت عندنا ثالثة لزوّجناها»."}, {"t": 2272, "p": "كان يصوم الدهر ويقوم الليل، وصحّ عنه إنه قرأ القرآن في ركعة يوتر بها. جدّد في عبادتك واكسر حاجة جديدة، خصوصاً يوم الإجازة."}, {"t": 2406, "p": "بُشّر بالجنة، وبالشهادة: «اثبت أحد، فإنما عليك نبي وصديق وشهيدان». وقال ابن عمر: كنا لا نعدل بأبي بكر أحداً، ثم عمر، ثم عثمان."}, {"t": 2490, "p": "الفتنة جت من حديثي العهد بالإسلام اللي عندهم عزيمة من غير فقه. فلو إنت جديد في الدين ما تتصدّرش في اللي ما تفهموش، واسأل أهل الذكر."}, {"t": 2537, "p": "رجل سأل ابن عمر: شهد عثمان بدراً؟ أفرّ يوم أحد؟ غاب عن بيعة الرضوان؟ فرد عليه: تخلّف عن بدر يمرّض بنت النبي ﷺ وضُرب له بسهمه، وعفا الله عن الفارّين يوم أحد، وبيعة الرضوان كانت عشانه، وقال النبي ﷺ: «هذه يد عثمان». ما تتتبّعش عورات الناس."}, {"t": 2747, "p": "المهاجرين استنكروا ماء المدينة، فقال النبي ﷺ: من يشتري بئر رومة وله عين في الجنة؟ فاشتراها عثمان. «اشترى عثمان الجنة من النبي ﷺ مرتين: يوم رومة، ويوم جيش العسرة»."}, {"t": 3041, "p": "اشترى نصفها الأول، فكان الناس يستقوا يومين في يومه، فباعه اليهودي النص التاني. وما ذكرهاش طول عمره إلا يوم الحصار لما منعوه الماء. «لا يزال الشيطان بالإنسان حتى يحدّث بعمله»."}, {"t": 3302, "p": "النبي ﷺ كان مضطجع كاشف عن ساقيه، ودخل أبو بكر ثم عمر، فلما دخل عثمان جلس وسوّى ثيابه وقال: «ألا أستحي من رجل تستحي منه الملائكة؟». وخشي لو دخل وهو على حاله ما يقضيش حاجته من شدة حيائه."}, {"t": 3483, "p": "«الإيمان بضع وسبعون شعبة... والحياء شعبة من الإيمان». قالوا: خصّه بالذكر لأنه مفتاح الشعب كلها. و«إن لكل دين خلقاً، وخلق الإسلام الحياء»، و«ما كان الحياء في شيء إلا زانه»."}, {"t": 3756, "p": "لما ضاع الدين ضاع معه الحياء. والمرأة كانت تلتصق بالحائط في الطريق من شدة سترها، و«بيوتهن خير لهن»."}], "status": "draft"}}, {"id": "ali", "name": "علي بن أبي طالب", "full": "علي بن أبي طالب بن عبد المطلب الهاشمي، أبو الحسن", "title": "«أنت مني بمنزلة هارون من موسى»", "oneLine": "تربى في حجر النبي ﷺ، وأخذ الراية يوم خيبر، وحمل الخلافة في أشد سنين الفتنة.", "links": ["muhajir", "sabq", "badr", "uhud", "khandaq", "qiyada", "fitna"], "axes": [{"t": "خيبر والراية", "g": "g", "src": "البخاري ومسلم", "f": ["«يحب الله ورسوله ويحبه الله ورسوله»"]}, {"t": "علمه وقضاؤه", "g": "y", "src": "آثار عن الصحابة", "f": ["العلم بيتاخد بالملازمة"]}, {"t": "الجمل وصفين", "g": "n", "src": "منهج أهل السنة", "f": ["نترضّى عن الكل", "الطائفتان مؤمنتان"]}], "message": "اتكلم عن الصحابة بلسان نضيف: نترضّى عنهم كلهم.", "parts": [{"video": "fcvXPLR6pwk", "dur": "١:٠٦ س", "label": "أبو تراب: النشأة والشجاعة والعلم", "intro": "المجلس الأول عن علي بن أبي طالب: اسمه وكنيته «أبو تراب»، وتربيته في حجر النبي ﷺ، وفضائله، ثم شجاعته في الهجرة وبدر وأحد والخندق وخيبر، ثم علمه وقضاؤه.", "points": [{"t": 66, "p": "الدعوة زي الجيم: لو انقطعت عنها تحس إنك بتبدأ من الأول. ومش إنت اللي بتعمل جميلة، ربنا هو اللي أكرمك بيها: ﴿معذرة إلى ربكم ولعلهم يتقون﴾."}, {"t": 148, "p": "ابن عم النبي ﷺ وزوج فاطمة وأبو الحسن والحسين سيدي شباب أهل الجنة. أسلم وهو ابن عشر سنين تقريباً وتربى في حجر النبي ﷺ، فشرب الإسلام شرباً، وكان حامل لوائه في المشاهد."}, {"t": 346, "p": "علي بن أبي طالب بن عبد المطلب بن هاشم. أحب كنيته إليه «أبو تراب»: النبي ﷺ لقاه نايم في المسجد والتراب على جنبه فجعل يمسحه ويقول: «قم أبا تراب». سمّاها النبي ﷺ فبقت أحب الأسماء له."}, {"t": 492, "p": "أمه فاطمة بنت أسد هاجرت وماتت في حياة النبي ﷺ. وكان أصلع، ربعة يميل للقصر، عظيم اللحية، كثير شعر الجسد. ما تحكمش على الناس بشكلهم، والصورة الذهنية للبطل اللي بيصدّروها في الأفلام مقصودة."}, {"t": 839, "p": "«أنا الذي سمّتني أمي حيدرة، كليث غابات كريه المنظرة». ومن فضائله: «من كنت مولاه فعليّ مولاه»، و«أنت مني بمنزلة هارون من موسى إلا أنه لا نبي بعدي»، و«لا يحبك إلا مؤمن ولا يبغضك إلا منافق»."}, {"t": 1098, "p": "النبي ﷺ كفله في سنة شديدة على أبي طالب، والعباس كفل جعفر. وجمعوا بين الروايات: أول من أسلم من الرجال أبو بكر، ومن الصبيان علي. وكتير من الحِكم المنسوبة لعلي على النت ما قالهاش."}, {"t": 1222, "p": "«الناس ثلاثة: عالم رباني، ومتعلم على سبيل نجاة، وهمج رعاع أتباع كل ناعق». وكان شاعراً يرتجل الشعر."}, {"t": 1317, "p": "أول فدائي في الإسلام: نام في فراش النبي ﷺ ليلة الهجرة وهو عارف إن القوم داخلين يقتلوا اللي فيه. قال ابن عباس: شرى علي نفسه تلك الليلة."}, {"t": 1412, "p": "شجاعة المربّي: فزع أهل المدينة ليلاً، فسبقهم النبي ﷺ على فرس عُري لأبي طلحة وهو يقول: «لم تُراعوا». وكانوا إذا احمرّ البأس اتقوا برسول الله ﷺ، ويوم حنين: «أنا النبي لا كذب، أنا ابن عبد المطلب»."}, {"t": 1615, "p": "يوم بدر خرج عتبة وشيبة والوليد للمبارزة، فخرج ثلاثة من الأنصار فقالوا: أخرج إلينا أكفاءنا من قومنا، فأخرج النبي ﷺ عبيدة وحمزة وعلياً. قتل علي الوليد وحمزة شيبة، وأجهزا على عتبة. والأنصار فضلهم عظيم: «لو سلك الناس شعباً وسلكت الأنصار شعباً لسلكت شعب الأنصار»."}, {"t": 1875, "p": "يوم أحد قتل حامل لواء المشركين، وأصيب ست عشرة ضربة وهو يدافع عن النبي ﷺ، وحمل اللواء بعد استشهاد مصعب. وحامل اللواء بيحمل شهادة وفاته."}, {"t": 1997, "p": "الأحزاب: ﴿هذا ما وعدنا الله ورسوله﴾. وكلما تحزّبت الأحزاب على أهلنا في غزة ما بنزداد إلا يقيناً. وأخوف الرجال اللي ما لهوش ناصر إلا الله."}, {"t": 2130, "p": "خرج عمرو بن ودّ ينادي: أين جنتكم التي تزعمون؟ وعلي يقول: أنا له يا رسول الله، والنبي ﷺ يقول: «إنه عمرو، اجلس»، ثلاث مرات، فقال علي: وإن كان عمراً. «من قاتل لتكون كلمة الله هي العليا فهو في سبيل الله»."}, {"t": 2441, "p": "«وإن كانت أمريكا»: النفع والضر بيد الله. ولما عيّنوا لعلي حرس قال: إنه لا يكون أمر في الأرض حتى يُكتب في السماء، والقدر جُنّتي."}, {"t": 2481, "p": "قال له عمرو: غيرك يا ابن أخي، فإني أكره أن أريق دمك، قال: وأنا والله أحب أن أريق دمك. ضربه عمرو فثبت السيف في درقته وشجّ رأسه، فضربه علي على حبل العاتق، وسمعوا تكبيره من وسط الغبار. ﴿كم من فئة قليلة غلبت فئة كثيرة بإذن الله﴾."}, {"t": 2744, "p": "عمر كان يوصي الجيوش: إنما ننتصر بخفة الذنوب، فإن استوينا معهم في المعاصي غلبونا بالعدد والعدة."}, {"t": 2768, "p": "خيبر حصن اليهود. «لأعطين الراية غداً رجلاً يحب الله ورسوله ويحبه الله ورسوله»، فبات الناس يدوكون. وعلي كان يشتكي عينيه، فبصق فيهما النبي ﷺ فبرئ كأن لم يكن به وجع."}, {"t": 3076, "p": "«انفذ على رسلك حتى تنزل بساحتهم، ثم ادعهم إلى الإسلام... فوالله لأن يهدي الله بك رجلاً واحداً خير لك من حمر النعم». قالها وهو رايح يقاتل اليهود، فكن رحيماً بالناس وانت بتدعوهم."}, {"t": 3243, "p": "عامر بن الأكوع كان يرتجز: «والله لولا الله ما اهتدينا»، وقُتل بسيفه هو، فقالوا: بطل عمله، فقال النبي ﷺ: «إن له لأجرين». ثم خرج مرحب فبارزه علي وفلق رأسه وكان الفتح على يديه."}, {"t": 3388, "p": "يُروى إنه تترّس بباب الحصن ولم يقدر ثمانية على قلبه بعد ذلك. والكرامات بتحصل للمجاهد الصادق."}, {"t": 3570, "p": "علمه: كان إذا حدّثه أحد عن النبي ﷺ استحلفه، فإن حلف صدّقه. وكان يقول: «سلوني عن كتاب الله، فوالله ما من آية إلا وأنا أعلم أبليل نزلت أم بنهار». وقالت عائشة: أما إنه أعلم من بقي بالسنة."}, {"t": 3700, "p": "بعثه النبي ﷺ لليمن قاضياً وهو حديث السن، فضرب صدره وقال: «إن الله سيهدي قلبك ويثبت لسانك»، فما شك في قضاء بعدها. وقال عمر: «علي أقضانا، وأبيّ أقرؤنا»، و«أعوذ بالله من معضلة ليس لها أبو الحسن»."}], "status": "draft"}, {"video": "2Nc4NsI8aJQ", "dur": "١:١١ س", "label": "خلافته والفتنة وكيف ننظر إليها", "intro": "المجلس التاني عن علي: مكانه في الشورى والقضاء بعد النبي ﷺ، ثم خمس سنين خلافته المليانة فتن: الجمل وصفين والنهروان واستشهاده. والمحور: إزاي ننظر للي شجر بين الصحابة على منهج أهل السنة.", "points": [{"t": 161, "p": "لما مات النبي ﷺ كان علي يهيم كالطفل، لأن حياته كلها كانت حوالين النبي ﷺ. وبعدها كان نعم القاضي وصاحب المشورة، وما خرجش من المدينة في عهد الثلاثة."}, {"t": 226, "p": "عمر ما كانش يسيب كبار الصحابة يخرجوا من المدينة، وكان مجلسه فيه شيوخ وشباب: حكمة الكبار ما تبقاش جُبن، وحماس الشباب يتوازن."}, {"t": 322, "p": "مقتل عثمان كان بداية سلسلة فتن غيّرت التاريخ. خمس سنين خلافة علي كأنها خمسين سنة من كثرة الأحداث."}, {"t": 417, "p": "الأصل في الفتنة بين الصحابة التوقف، وده مذهب أهل السنة. والشيخ قال إنه قرأ مئات الصفحات وسأل مشايخه قبل ما يتكلم، عشان يحط إطار عام."}, {"t": 524, "p": "عقيدتنا في الصحابة خمس: محبتهم، وعدالتهم كلهم، وسلامة القلوب والألسنة تجاههم، والإمساك عما شجر بينهم، والدعاء والاستغفار لهم. والصحابي من لقي النبي ﷺ مؤمناً به ومات على ذلك."}, {"t": 604, "p": "«الحكم على الشيء فرع عن تصوره». والفتنة كانت مقصودة: ابن سبأ اليهودي ألّب الناس، وكتير من المؤرخين نقلوا الضعيف والمنكر، فلازم أمانة في النقل."}, {"t": 816, "p": "«آية الإيمان حب الأنصار». و﴿والذين جاؤوا من بعدهم يقولون ربنا اغفر لنا ولإخواننا الذين سبقونا بالإيمان﴾. قال الفضيل: حب أصحاب محمد ﷺ ذخر أدّخره."}, {"t": 909, "p": "قال علي: «يهلك فيّ رجلان: محب مُفرط يقرّظني بما ليس فيّ، ومبغض مفترٍ». ومن هنا طلعت الشيعة والنواصب والخوارج، وبعضهم وصل لتأليه علي فحرّقهم. كل بدعة بتبدأ صغيرة."}, {"t": 1099, "p": "العدالة يعني ملكة تحمل على التقوى والمروءة، وما بتسقطش بالمعصية: الصحابي اللي كان يُجلد في الخمر قال فيه النبي ﷺ: «لا تلعنوه، فوالله ما علمت إلا أنه يحب الله ورسوله». وكان أكثر الصحابة مقلّين في الرواية خوفاً من الكذب على النبي ﷺ."}, {"t": 1260, "p": "﴿محمد رسول الله والذين معه أشداء على الكفار رحماء بينهم﴾، و«خير الناس قرني ثم الذين يلونهم»، و«لا تسبّوا أصحابي، فلو أنفق أحدكم مثل أحد ذهباً ما بلغ مدّ أحدهم ولا نصيفه»."}, {"t": 1380, "p": "عشان تفهم موقف زي غضب عمر في السقيفة لازم تتخيّل الفتنة اللي كانت هتحصل. وأغلب الصحابة اعتزلوا الفتنة، زي ابن عمر اللي خاف سيفه يصيب دم مسلم."}, {"t": 1458, "p": "«تقتل عماراً الفئة الباغية»، فالحق كان مع علي. وكل الصحابة متأوّلون: من أصاب له أجران ومن أخطأ له أجر، وما كنا هنفهم أحكام البغي من غير المشهد ده."}, {"t": 1560, "p": "نائلة بعتت قميص عثمان وأصابعها المقطوعة لمعاوية، وهو ولي الدم من بني أمية. معاوية ما نازعش علياً في الخلافة، كان عايز القصاص من قتلة عثمان أولاً."}, {"t": 1652, "p": "السبئية زوّروا كتباً وأختاماً على لسان عثمان وعلي، والرسالة من المدينة للشام كانت تاخد أسابيع، فدخل التزوير بسهولة. والصحابة بشر فيهم السياسي الحاذق زي معاوية وعمرو، ومش صورة ملائكية."}, {"t": 1866, "p": "قال علي لأحد الخوارج: كنا على عهد أبي بكر وعمر نحن الرعية، أما على عهدي فأنتم الرعية. وكان يأمر فلا يُطاع، حتى دعا الله يقبضه."}, {"t": 2011, "p": "«دعوها فإنها منتنة»، و«إن الشيطان قد أيس أن يعبده المصلون في جزيرة العرب، ولكن في التحريش بينهم». ما تضيّعش ساعات في خناقات الفيسبوك على حاجة ما تعنيكش. قال الحسن: تلك فتنة عصم الله منها سيوفنا، فلنعصم منها ألسنتنا."}, {"t": 2200, "p": "«الله الله في أصحابي لا تتخذوهم غرضاً بعدي، فمن أحبهم فبحبي أحبهم، ومن أبغضهم فببغضي أبغضهم». وقال أبو زرعة: إذا رأيت الرجل ينتقص أحداً من الصحابة فاعلم أنه زنديق، لأنهم هم اللي أدّوا لنا القرآن والسنة."}, {"t": 2500, "p": "بعد مقتل عثمان الثوار لفّوا على طلحة والزبير يخلّوهم خلفاء فهربوا منهم. واجتمع الصحابة على علي، فأصرّ تكون البيعة في المسجد علناً، ومن المهاجرين والأنصار وأهل بدر."}, {"t": 2760, "p": "الجمل: طلحة والزبير وعائشة خرجوا للبصرة يطلبوا القصاص، ما قصدوش قتال علي ولا هو قصد قتالهم، وكادوا يصطلحوا. فخاف قتلة عثمان من الصلح فحملوا بالليل على الفريقين، فظن كل فريق أن الآخر غدر، ووقعت الفتنة بغير اختيارهم. وبكى علي على القتلى."}, {"t": 3240, "p": "ابن سيرين: هاجت الفتنة وأصحاب رسول الله ﷺ عشرة آلاف، فما حضرها منهم مائة. وقال شعبة: ما شهد صفين من أهل بدر إلا خزيمة بن ثابت."}, {"t": 3420, "p": "قال سعد بن أبي وقاص: الناس على ثلاث منازل: المهاجرون، والأنصار، و﴿الذين جاؤوا من بعدهم يقولون ربنا اغفر لنا ولإخواننا﴾. مضت اتنتين، فأحسن ما تكونوا عليه التالتة."}, {"t": 3563, "p": "بعد صفين رفع أهل الشام المصاحف وقالوا: من للذراري ومن للنساء؟ فقبل علي التحكيم، فخرجت عليه فرقة اسمها «القرّاء» من كثرة عبادتهم وقالوا: تحكّم الرجال في دين الله؟ وكفّروه. «يقرؤون القرآن لا يجاوز تراقيهم»."}, {"t": 3870, "p": "قاتلهم في النهروان وسجد شكراً، وما كان يأمن على نفسه، وكان يلبس الخشن ويقول: «هو أبعد من الكبر وأجدر أن يقتدي به المسلم»."}, {"t": 3942, "p": "استُشهد في ١٧ رمضان سنة ٤٠ هـ وهو خارج يوقظ الناس لصلاة الفجر، طعنه ابن ملجم. والخوارج اتفقوا يقتلوا علياً ومعاوية وعمراً، فنجا معاوية وعمرو."}, {"t": 4060, "p": "«إن ابني هذا سيد، ولعل الله أن يصلح به بين فئتين عظيمتين من المسلمين»، فتنازل لمعاوية بعد ستة أشهر حقناً للدماء. الصحابة كانوا يعملوا لله مش للمناصب، فتعلّم العلم وحب الصحابة لتُحشر معهم."}], "status": "draft"}], "ten": true, "video": "fcvXPLR6pwk", "summary": {"intro": "المجلس الأول عن علي بن أبي طالب: اسمه وكنيته «أبو تراب»، وتربيته في حجر النبي ﷺ، وفضائله، ثم شجاعته في الهجرة وبدر وأحد والخندق وخيبر، ثم علمه وقضاؤه.", "points": [{"t": 66, "p": "الدعوة زي الجيم: لو انقطعت عنها تحس إنك بتبدأ من الأول. ومش إنت اللي بتعمل جميلة، ربنا هو اللي أكرمك بيها: ﴿معذرة إلى ربكم ولعلهم يتقون﴾."}, {"t": 148, "p": "ابن عم النبي ﷺ وزوج فاطمة وأبو الحسن والحسين سيدي شباب أهل الجنة. أسلم وهو ابن عشر سنين تقريباً وتربى في حجر النبي ﷺ، فشرب الإسلام شرباً، وكان حامل لوائه في المشاهد."}, {"t": 346, "p": "علي بن أبي طالب بن عبد المطلب بن هاشم. أحب كنيته إليه «أبو تراب»: النبي ﷺ لقاه نايم في المسجد والتراب على جنبه فجعل يمسحه ويقول: «قم أبا تراب». سمّاها النبي ﷺ فبقت أحب الأسماء له."}, {"t": 492, "p": "أمه فاطمة بنت أسد هاجرت وماتت في حياة النبي ﷺ. وكان أصلع، ربعة يميل للقصر، عظيم اللحية، كثير شعر الجسد. ما تحكمش على الناس بشكلهم، والصورة الذهنية للبطل اللي بيصدّروها في الأفلام مقصودة."}, {"t": 839, "p": "«أنا الذي سمّتني أمي حيدرة، كليث غابات كريه المنظرة». ومن فضائله: «من كنت مولاه فعليّ مولاه»، و«أنت مني بمنزلة هارون من موسى إلا أنه لا نبي بعدي»، و«لا يحبك إلا مؤمن ولا يبغضك إلا منافق»."}, {"t": 1098, "p": "النبي ﷺ كفله في سنة شديدة على أبي طالب، والعباس كفل جعفر. وجمعوا بين الروايات: أول من أسلم من الرجال أبو بكر، ومن الصبيان علي. وكتير من الحِكم المنسوبة لعلي على النت ما قالهاش."}, {"t": 1222, "p": "«الناس ثلاثة: عالم رباني، ومتعلم على سبيل نجاة، وهمج رعاع أتباع كل ناعق». وكان شاعراً يرتجل الشعر."}, {"t": 1317, "p": "أول فدائي في الإسلام: نام في فراش النبي ﷺ ليلة الهجرة وهو عارف إن القوم داخلين يقتلوا اللي فيه. قال ابن عباس: شرى علي نفسه تلك الليلة."}, {"t": 1412, "p": "شجاعة المربّي: فزع أهل المدينة ليلاً، فسبقهم النبي ﷺ على فرس عُري لأبي طلحة وهو يقول: «لم تُراعوا». وكانوا إذا احمرّ البأس اتقوا برسول الله ﷺ، ويوم حنين: «أنا النبي لا كذب، أنا ابن عبد المطلب»."}, {"t": 1615, "p": "يوم بدر خرج عتبة وشيبة والوليد للمبارزة، فخرج ثلاثة من الأنصار فقالوا: أخرج إلينا أكفاءنا من قومنا، فأخرج النبي ﷺ عبيدة وحمزة وعلياً. قتل علي الوليد وحمزة شيبة، وأجهزا على عتبة. والأنصار فضلهم عظيم: «لو سلك الناس شعباً وسلكت الأنصار شعباً لسلكت شعب الأنصار»."}, {"t": 1875, "p": "يوم أحد قتل حامل لواء المشركين، وأصيب ست عشرة ضربة وهو يدافع عن النبي ﷺ، وحمل اللواء بعد استشهاد مصعب. وحامل اللواء بيحمل شهادة وفاته."}, {"t": 1997, "p": "الأحزاب: ﴿هذا ما وعدنا الله ورسوله﴾. وكلما تحزّبت الأحزاب على أهلنا في غزة ما بنزداد إلا يقيناً. وأخوف الرجال اللي ما لهوش ناصر إلا الله."}, {"t": 2130, "p": "خرج عمرو بن ودّ ينادي: أين جنتكم التي تزعمون؟ وعلي يقول: أنا له يا رسول الله، والنبي ﷺ يقول: «إنه عمرو، اجلس»، ثلاث مرات، فقال علي: وإن كان عمراً. «من قاتل لتكون كلمة الله هي العليا فهو في سبيل الله»."}, {"t": 2441, "p": "«وإن كانت أمريكا»: النفع والضر بيد الله. ولما عيّنوا لعلي حرس قال: إنه لا يكون أمر في الأرض حتى يُكتب في السماء، والقدر جُنّتي."}, {"t": 2481, "p": "قال له عمرو: غيرك يا ابن أخي، فإني أكره أن أريق دمك، قال: وأنا والله أحب أن أريق دمك. ضربه عمرو فثبت السيف في درقته وشجّ رأسه، فضربه علي على حبل العاتق، وسمعوا تكبيره من وسط الغبار. ﴿كم من فئة قليلة غلبت فئة كثيرة بإذن الله﴾."}, {"t": 2744, "p": "عمر كان يوصي الجيوش: إنما ننتصر بخفة الذنوب، فإن استوينا معهم في المعاصي غلبونا بالعدد والعدة."}, {"t": 2768, "p": "خيبر حصن اليهود. «لأعطين الراية غداً رجلاً يحب الله ورسوله ويحبه الله ورسوله»، فبات الناس يدوكون. وعلي كان يشتكي عينيه، فبصق فيهما النبي ﷺ فبرئ كأن لم يكن به وجع."}, {"t": 3076, "p": "«انفذ على رسلك حتى تنزل بساحتهم، ثم ادعهم إلى الإسلام... فوالله لأن يهدي الله بك رجلاً واحداً خير لك من حمر النعم». قالها وهو رايح يقاتل اليهود، فكن رحيماً بالناس وانت بتدعوهم."}, {"t": 3243, "p": "عامر بن الأكوع كان يرتجز: «والله لولا الله ما اهتدينا»، وقُتل بسيفه هو، فقالوا: بطل عمله، فقال النبي ﷺ: «إن له لأجرين». ثم خرج مرحب فبارزه علي وفلق رأسه وكان الفتح على يديه."}, {"t": 3388, "p": "يُروى إنه تترّس بباب الحصن ولم يقدر ثمانية على قلبه بعد ذلك. والكرامات بتحصل للمجاهد الصادق."}, {"t": 3570, "p": "علمه: كان إذا حدّثه أحد عن النبي ﷺ استحلفه، فإن حلف صدّقه. وكان يقول: «سلوني عن كتاب الله، فوالله ما من آية إلا وأنا أعلم أبليل نزلت أم بنهار». وقالت عائشة: أما إنه أعلم من بقي بالسنة."}, {"t": 3700, "p": "بعثه النبي ﷺ لليمن قاضياً وهو حديث السن، فضرب صدره وقال: «إن الله سيهدي قلبك ويثبت لسانك»، فما شك في قضاء بعدها. وقال عمر: «علي أقضانا، وأبيّ أقرؤنا»، و«أعوذ بالله من معضلة ليس لها أبو الحسن»."}], "status": "draft"}}, {"id": "talha", "name": "طلحة بن عبيد الله", "full": "طلحة بن عبيد الله التيمي القرشي، أبو محمد", "title": "«من سرّه أن ينظر إلى شهيد يمشي على الأرض فلينظر إلى طلحة»", "oneLine": "وقى النبي ﷺ بيده يوم أحد حتى شُلّت، وكان من أجود الناس.", "links": ["muhajir", "taym", "sabq", "uhud", "infaq", "tadhiya", "fitna"], "axes": [{"t": "يوم أحد", "g": "g", "src": "البخاري", "f": ["يده الشلّاء", "«أوجب طلحة»"]}, {"t": "قيامه لكعب بن مالك", "g": "g", "src": "البخاري ومسلم", "f": ["الفرحة لأخوك بتوبته"]}, {"t": "الجمل", "g": "y", "src": "سير وتواريخ", "f": ["نترضّى عنهم ونمسك عما شجر"]}], "message": "إيه اليوم اللي هيبقى كله ليك قدام ربنا؟", "parts": [{"video": "gtibrpps3kQ", "dur": "١:٠٩ س", "label": "الشهيد الحي", "intro": "حلقة عن طلحة بن عبيد الله: إسلامه بعد بشارة راهب بُصرى، ويوم أحد اللي قال فيه أبو بكر «ذاك يوم كله لطلحة»، وجوده وكرمه، ووقفته مع كعب بن مالك، واستشهاده يوم الجمل.", "points": [{"t": 47, "p": "﴿قالت الأعراب آمنا قل لم تؤمنوا ولكن قولوا أسلمنا﴾: الإيمان شيء عزيز ما تنسبهوش لنفسك بسهولة. وإحنا بنقعد في المجالس دي عشان نحب الصحابة، و«المرء مع من أحب»."}, {"t": 236, "p": "«لا تسبّوا أصحابي» قالها النبي ﷺ لخالد لما سبّ عبد الرحمن بن عوف: مهما عملت من أعمال ما تبلغش مد أحدهم ولا نصيفه."}, {"t": 380, "p": "النبي ﷺ اطمأن لقلوب العشرة فبشّرهم بالجنة وهم يمشون على الأرض، لأنه علم إنهم مش هيتغيروا بعد البشارة."}, {"t": 428, "p": "طلحة بن عبيد الله، تيمي ابن عم أبي بكر، يلتقي مع النبي ﷺ في مرة بن كعب. أبيض فيه حمرة، مربوع يميل للقصر، عريض المنكبين، ضخم القدمين، وهي بنية هيفنيها في سبيل الله."}, {"t": 529, "p": "من الثمانية الذين سبقوا إلى الإسلام، ومن الستة أصحاب الشورى، ومن الخمسة اللي أسلموا على يد أبي بكر. السبق في الدين: ﴿سابقوا إلى مغفرة﴾ بينما الدنيا ﴿فامشوا في مناكبها﴾."}, {"t": 725, "p": "أبو بكر ما عملش غير إنه وجّهه للنبي ﷺ، فكلمة واحدة أو درس بتبعته ممكن يكون لبنة في إيمان حد. واصرف مشاعرك في حب النبي ﷺ وصحابته بدل ما تفنيها في حب لاعب أو مغني."}, {"t": 886, "p": "كان تاجراً في سوق بُصرى بالشام، فقال راهب: هل ظهر أحمد؟ هذا شهره الذي يخرج فيه، ومهاجره إلى نخل وحرّة وسباخ، «فإياك أن تُسبق إليه». النية أسبق من العمل، وقال أحمد لابنه: انوِ الخير فإنك لا تزال بخير ما نويت الخير."}, {"t": 1069, "p": "رجع مكة فقالوا: محمد الأمين تنبأ وتبعه ابن أبي قحافة، فقال له أبو بكر: «انطلق إليه فاتبعه فإنه يدعو إلى الحق»، فأسلم. وقرنه نوفل بن خويلد مع أبي بكر في حبل واحد فسُمّيا القرينين."}, {"t": 1320, "p": "فاتته بدر لأنه كان في تجارة بالشام، فضرب له النبي ﷺ بسهمه، فقال: وأجري يا رسول الله؟ قال: وأجرك. «إن بالمدينة أقواماً ما سرتم مسيراً ولا قطعتم وادياً إلا كانوا معكم، حبسهم العذر»."}, {"t": 1460, "p": "أصعب حاجة في الدين الصدق. حذيفة لما قال له رجل: لو أدركنا النبي ﷺ لحملناه على رقابنا، قال: هوّن عليك، وحكى برد الأحزاب. ﴿اتقوا الله وكونوا مع الصادقين﴾."}, {"t": 1611, "p": "يوم أحد انكشف المسلمون، وفي البخاري: لم يبقَ مع النبي ﷺ في بعض تلك الأيام إلا طلحة وسعد. فقال النبي ﷺ: «أوجب طلحة»."}, {"t": 1700, "p": "قال سعيد بن زيد لمن سبّ الصحابة: «لمشهد رجل منهم مع رسول الله ﷺ يغبّر فيه وجهه خير من عمل أحدكم ولو عُمّر عمر نوح». و«موقف ساعة في سبيل الله خير من قيام ليلة القدر عند الحجر الأسود»."}, {"t": 1850, "p": "«كفى ببارقة السيوف على رأسه فتنة». العجب مش ممن هلك كيف هلك، العجب ممن نجا كيف نجا. و«لا تتمنوا لقاء العدو، فإذا لقيتموهم فاثبتوا»."}, {"t": 1890, "p": "قال أبو بكر: كنت أول من فاء إلى النبي ﷺ، فرأيت رجلاً يقاتل دونه، فقلت: كن طلحة، فداك أبي وأمي. ولقوه صريعاً فيه بضع وسبعون ما بين ضربة وطعنة ورمية. «ذاك يوم كله لطلحة»."}, {"t": 2087, "p": "الجسم ده هيفنى، فأفنيه في طاعة الله: الأقدام للصلاة والجهاد، والعين لكتاب الله، وهتشهد عليك أو لك يوم القيامة."}, {"t": 2142, "p": "أبو عبيدة نزع حلقتي المغفر من وجه النبي ﷺ بأسنانه وقال: نشدتك بالله يا أبا بكر إلا تركتني، فسقطت ثنيتاه. وشُلّت يد طلحة وهو يقي وجه النبي ﷺ من النبل، ولما قال «حسّ» قال النبي ﷺ: «لو قلت بسم الله لرفعتك الملائكة والناس ينظرون»."}, {"t": 2400, "p": "النبي ﷺ أراد يصعد صخرة وعليه درعان فما استطاع، فأقعد تحته طلحة فصعد على ظهره. قال الزبير: فسمعته يقول «أوجب طلحة»."}, {"t": 2600, "p": "«من للقوم؟» فيقول طلحة: أنا، فيقول: كما أنت، ويخرج أنصاري يقاتل حتى يُقتل، حتى قُتل الأحد عشر، ثم قاتل طلحة قتالهم حتى قُطعت أصابعه. وقال فيه حسان: «وطلحة يوم الشعب آسى محمداً... وقاه بكفيه الرماح فشُلّت»."}, {"t": 2759, "p": "سمّاه النبي ﷺ يوم أحد طلحة الخير، ويوم العسرة طلحة الفيّاض، ويوم حنين طلحة الجود. وقال: «من سرّه أن ينظر إلى شهيد يمشي على وجه الأرض فلينظر إلى طلحة»، ولما سُئل عمّن قضى نحبه أشار إليه: «هذا ممن قضى نحبه»."}, {"t": 3020, "p": "جاه ٧٠٠ ألف من حضرموت فبات يتململ وقال: ما ظنّ رجل بربه يبيت وهذا المال في بيته؟ فقالت زوجته: إذا أصبحت فادعُ بقصاع ففرّقه، فقال: إنك موفّقة بنت موفّق. فما بقي إلا ألف درهم."}, {"t": 3190, "p": "كان لا يدع أحداً من بني تيم عائلاً إلا كفاه وقضى دينه، ويبعت لعائشة كل سنة عشرة آلاف. وقال قبيصة: ما رأيت رجلاً أعطى لجزيل مال من غير مسألة منه."}, {"t": 3305, "p": "لما تاب الله على كعب بن مالك قام إليه طلحة يهرول حتى صافحه وهنّأه، فقال كعب: «والله لا أنساها لطلحة». أخوك اللي وقع في ذنب محتاج حد يقول له إن فيه خير، مش حد يبعد عنه."}, {"t": 3653, "p": "أخبر النبي ﷺ على حراء إن كلهم شهداء. استُشهد يوم الجمل سنة ٣٦ هـ، رماه سهم قيل إنه من مروان بن الحكم، وكان يقول: داهنّا في أمر عثمان، اللهم خذ لعثمان مني حتى يرضى. ومسح علي التراب عن وجهه وقال: عزيز عليّ أبا محمد أن أراك مجدّلاً تحت نجوم السماء."}], "status": "draft"}], "ten": true, "video": "gtibrpps3kQ", "summary": {"intro": "حلقة عن طلحة بن عبيد الله: إسلامه بعد بشارة راهب بُصرى، ويوم أحد اللي قال فيه أبو بكر «ذاك يوم كله لطلحة»، وجوده وكرمه، ووقفته مع كعب بن مالك، واستشهاده يوم الجمل.", "points": [{"t": 47, "p": "﴿قالت الأعراب آمنا قل لم تؤمنوا ولكن قولوا أسلمنا﴾: الإيمان شيء عزيز ما تنسبهوش لنفسك بسهولة. وإحنا بنقعد في المجالس دي عشان نحب الصحابة، و«المرء مع من أحب»."}, {"t": 236, "p": "«لا تسبّوا أصحابي» قالها النبي ﷺ لخالد لما سبّ عبد الرحمن بن عوف: مهما عملت من أعمال ما تبلغش مد أحدهم ولا نصيفه."}, {"t": 380, "p": "النبي ﷺ اطمأن لقلوب العشرة فبشّرهم بالجنة وهم يمشون على الأرض، لأنه علم إنهم مش هيتغيروا بعد البشارة."}, {"t": 428, "p": "طلحة بن عبيد الله، تيمي ابن عم أبي بكر، يلتقي مع النبي ﷺ في مرة بن كعب. أبيض فيه حمرة، مربوع يميل للقصر، عريض المنكبين، ضخم القدمين، وهي بنية هيفنيها في سبيل الله."}, {"t": 529, "p": "من الثمانية الذين سبقوا إلى الإسلام، ومن الستة أصحاب الشورى، ومن الخمسة اللي أسلموا على يد أبي بكر. السبق في الدين: ﴿سابقوا إلى مغفرة﴾ بينما الدنيا ﴿فامشوا في مناكبها﴾."}, {"t": 725, "p": "أبو بكر ما عملش غير إنه وجّهه للنبي ﷺ، فكلمة واحدة أو درس بتبعته ممكن يكون لبنة في إيمان حد. واصرف مشاعرك في حب النبي ﷺ وصحابته بدل ما تفنيها في حب لاعب أو مغني."}, {"t": 886, "p": "كان تاجراً في سوق بُصرى بالشام، فقال راهب: هل ظهر أحمد؟ هذا شهره الذي يخرج فيه، ومهاجره إلى نخل وحرّة وسباخ، «فإياك أن تُسبق إليه». النية أسبق من العمل، وقال أحمد لابنه: انوِ الخير فإنك لا تزال بخير ما نويت الخير."}, {"t": 1069, "p": "رجع مكة فقالوا: محمد الأمين تنبأ وتبعه ابن أبي قحافة، فقال له أبو بكر: «انطلق إليه فاتبعه فإنه يدعو إلى الحق»، فأسلم. وقرنه نوفل بن خويلد مع أبي بكر في حبل واحد فسُمّيا القرينين."}, {"t": 1320, "p": "فاتته بدر لأنه كان في تجارة بالشام، فضرب له النبي ﷺ بسهمه، فقال: وأجري يا رسول الله؟ قال: وأجرك. «إن بالمدينة أقواماً ما سرتم مسيراً ولا قطعتم وادياً إلا كانوا معكم، حبسهم العذر»."}, {"t": 1460, "p": "أصعب حاجة في الدين الصدق. حذيفة لما قال له رجل: لو أدركنا النبي ﷺ لحملناه على رقابنا، قال: هوّن عليك، وحكى برد الأحزاب. ﴿اتقوا الله وكونوا مع الصادقين﴾."}, {"t": 1611, "p": "يوم أحد انكشف المسلمون، وفي البخاري: لم يبقَ مع النبي ﷺ في بعض تلك الأيام إلا طلحة وسعد. فقال النبي ﷺ: «أوجب طلحة»."}, {"t": 1700, "p": "قال سعيد بن زيد لمن سبّ الصحابة: «لمشهد رجل منهم مع رسول الله ﷺ يغبّر فيه وجهه خير من عمل أحدكم ولو عُمّر عمر نوح». و«موقف ساعة في سبيل الله خير من قيام ليلة القدر عند الحجر الأسود»."}, {"t": 1850, "p": "«كفى ببارقة السيوف على رأسه فتنة». العجب مش ممن هلك كيف هلك، العجب ممن نجا كيف نجا. و«لا تتمنوا لقاء العدو، فإذا لقيتموهم فاثبتوا»."}, {"t": 1890, "p": "قال أبو بكر: كنت أول من فاء إلى النبي ﷺ، فرأيت رجلاً يقاتل دونه، فقلت: كن طلحة، فداك أبي وأمي. ولقوه صريعاً فيه بضع وسبعون ما بين ضربة وطعنة ورمية. «ذاك يوم كله لطلحة»."}, {"t": 2087, "p": "الجسم ده هيفنى، فأفنيه في طاعة الله: الأقدام للصلاة والجهاد، والعين لكتاب الله، وهتشهد عليك أو لك يوم القيامة."}, {"t": 2142, "p": "أبو عبيدة نزع حلقتي المغفر من وجه النبي ﷺ بأسنانه وقال: نشدتك بالله يا أبا بكر إلا تركتني، فسقطت ثنيتاه. وشُلّت يد طلحة وهو يقي وجه النبي ﷺ من النبل، ولما قال «حسّ» قال النبي ﷺ: «لو قلت بسم الله لرفعتك الملائكة والناس ينظرون»."}, {"t": 2400, "p": "النبي ﷺ أراد يصعد صخرة وعليه درعان فما استطاع، فأقعد تحته طلحة فصعد على ظهره. قال الزبير: فسمعته يقول «أوجب طلحة»."}, {"t": 2600, "p": "«من للقوم؟» فيقول طلحة: أنا، فيقول: كما أنت، ويخرج أنصاري يقاتل حتى يُقتل، حتى قُتل الأحد عشر، ثم قاتل طلحة قتالهم حتى قُطعت أصابعه. وقال فيه حسان: «وطلحة يوم الشعب آسى محمداً... وقاه بكفيه الرماح فشُلّت»."}, {"t": 2759, "p": "سمّاه النبي ﷺ يوم أحد طلحة الخير، ويوم العسرة طلحة الفيّاض، ويوم حنين طلحة الجود. وقال: «من سرّه أن ينظر إلى شهيد يمشي على وجه الأرض فلينظر إلى طلحة»، ولما سُئل عمّن قضى نحبه أشار إليه: «هذا ممن قضى نحبه»."}, {"t": 3020, "p": "جاه ٧٠٠ ألف من حضرموت فبات يتململ وقال: ما ظنّ رجل بربه يبيت وهذا المال في بيته؟ فقالت زوجته: إذا أصبحت فادعُ بقصاع ففرّقه، فقال: إنك موفّقة بنت موفّق. فما بقي إلا ألف درهم."}, {"t": 3190, "p": "كان لا يدع أحداً من بني تيم عائلاً إلا كفاه وقضى دينه، ويبعت لعائشة كل سنة عشرة آلاف. وقال قبيصة: ما رأيت رجلاً أعطى لجزيل مال من غير مسألة منه."}, {"t": 3305, "p": "لما تاب الله على كعب بن مالك قام إليه طلحة يهرول حتى صافحه وهنّأه، فقال كعب: «والله لا أنساها لطلحة». أخوك اللي وقع في ذنب محتاج حد يقول له إن فيه خير، مش حد يبعد عنه."}, {"t": 3653, "p": "أخبر النبي ﷺ على حراء إن كلهم شهداء. استُشهد يوم الجمل سنة ٣٦ هـ، رماه سهم قيل إنه من مروان بن الحكم، وكان يقول: داهنّا في أمر عثمان، اللهم خذ لعثمان مني حتى يرضى. ومسح علي التراب عن وجهه وقال: عزيز عليّ أبا محمد أن أراك مجدّلاً تحت نجوم السماء."}], "status": "draft"}}, {"id": "zubayr", "name": "الزبير بن العوام", "full": "الزبير بن العوام بن خويلد الأسدي، أبو عبد الله", "title": "«إن لكل نبي حوارياً، وحواريّ الزبير»", "oneLine": "ابن عمة النبي ﷺ، أول من سلّ سيفاً في الإسلام، وشقّ صفوف الروم يوم اليرموك.", "links": ["muhajir", "sabq", "badr", "uhud", "khandaq", "yarmouk", "tadhiya", "fitna"], "axes": [{"t": "الحواري", "g": "g", "src": "البخاري ومسلم", "f": ["القرب من النبي ﷺ بيغيّر الهيئة والكلام"]}, {"t": "«فداك أبي وأمي»", "g": "g", "src": "البخاري", "f": ["التطوع للمهمة الصعبة"]}, {"t": "أول سيف", "g": "y", "src": "ابن سعد، مرسل", "f": ["الغيرة على الدين من الصغر"]}, {"t": "الجمل", "g": "y", "src": "الحاكم", "f": ["«ذكّرتني ما نسيت» فرجع"]}], "message": "إنت ركن في المكان اللي إنت فيه؟ لو غبت يحسّوا؟", "parts": [{"video": "sIKHvLqsz10", "dur": "٥٥ د", "label": "حواريّ رسول الله ﷺ", "intro": "حلقة عن الزبير بن العوام: نسبه القريب من النبي ﷺ، وإسلامه صبياً وصبره على تعذيب عمه، وأول سيف سُلّ في الإسلام، وشجاعته في بدر والأحزاب واليرموك، واستشهاده بعد الجمل.", "points": [{"t": 51, "p": "لكل نبي حواريون يحملون معه الدين، والطريق ده دايماً فيه ابتلاء: ﴿وكأيّن من نبي قاتل معه ربّيون كثير فما وهنوا﴾. والحواري هو الملاصق للنبي اللي بياخد من هديه وسمته."}, {"t": 214, "p": "كل ما تقرب من بيئة الصلاح هيئتك وكلامك وحياتك بتتغير: ﴿واصبر نفسك مع الذين يدعون ربهم بالغداة والعشي﴾."}, {"t": 289, "p": "أمه صفية بنت عبد المطلب عمة النبي ﷺ، وخاله حمزة، وأبوه العوام أخو خديجة. «خيارهم في الجاهلية خيارهم في الإسلام إذا فقهوا»، فاللي اتربى في بيئة دين يُرجى له ما لا يُرجى لغيره."}, {"t": 384, "p": "أمه كانت تضربه وهو صغير ضرب شديد، ولما قالوا لها هتقتليه قالت: إنما أضربه ليلبّ ويجرّ الجيش ذا الجلب. وأسلم صغيراً، وهو وطلحة وعلي أقران، وقال الثوري: حمزة وعلي والزبير نجدة الصحابة."}, {"t": 509, "p": "أول من سلّ سيفاً في سبيل الله: سمع إن النبي ﷺ قُتل فخرج بالسيف، فلما لقيه قال: أردت أن أستعرض أهل مكة، فدعا له النبي ﷺ."}, {"t": 530, "p": "كان طويلاً إذا ركب تخط رجلاه الأرض، خفيف اللحية، أسمر. كنيته أبو عبد الله، ومات أبوه في حرب الفجار فنشأ يتيماً."}, {"t": 604, "p": "عمه كان يلفّه في حصير ويدخّن عليه وهو يقول: اكفر برب محمد أرفع عنك العذاب، فيقول: لا أكفر أبداً. لما تيجيلك فتنة في الشغل أو الجامعة قول: والله لا أترك الديني، مش مع أول خبطة تمشي."}, {"t": 720, "p": "ابنه عروة قال: كنت أدخل أصابعي في الضربات اللي في جسمه وأنا صغير ألعب بيها، وكان يقول: والله ما منها إلا مع رسول الله ﷺ. «إن هذا الدين أتاك على أشلاء أناس، فلا تكن محطة نحس فتفرط فيه»."}, {"t": 959, "p": "«أشد الناس بلاءً الأنبياء ثم الأمثل فالأمثل، يُبتلى الرجل على حسب دينه». وكان ابن مسعود يقول: اللهم لا تبتلنا فتفضحنا."}, {"t": 1253, "p": "قالت عائشة لعروة: أبوك من ﴿الذين استجابوا لله والرسول من بعد ما أصابهم القرح﴾. بعد أحد انتدب أبو بكر والزبير في سبعين يتبعوا المشركين عشان يعرفوا إن في المسلمين قوة."}, {"t": 1414, "p": "قال عمر: الزبير ركن من أركان الدين. هل إنت عمود في المكان اللي إنت فيه؟ لو قعدت في مجلس ما يبقاش فيه غيبة، ولو غبت عن المسجد يحسّوا؟ حتى لو بتقمّ المسجد أو بتحفّظ العيال قرآن."}, {"t": 1678, "p": "يوم بدر كانت له اليد البيضاء، وطعن عبيدة بن سعيد بن العاص في عينه وما كان يظهر منه إلا عيناه. ويوم أحد كان من أول اللاحقين بالنبي ﷺ، وهو راوي «أوجب طلحة»."}, {"t": 1858, "p": "جمع له النبي ﷺ أبويه: «فداك أبي وأمي» يوم الأحزاب، ولما قال: «من يأتينا بخبر القوم؟» قال الزبير: أنا، ثلاث مرات، فقال: «إن لكل نبي حوارياً، وحواريّ الزبير»."}, {"t": 1980, "p": "عمر بعت مدد لعمرو بن العاص في مصر: أربعة آلاف، على كل ألف رجل بألف، منهم الزبير. وضرب يوم الخندق عثمان بن عبد الله بن المغيرة على مغفره فقدّه إلى السرج."}, {"t": 2160, "p": "سيفه كان معروف بفلوله، وكل فلّة فيه مع رسول الله ﷺ. وقال: ما مني عضو إلا وقد جُرح مع رسول الله ﷺ. وفي صدره أمثال العيون من الطعن والرمي."}, {"t": 2308, "p": "«اللهم إني أعوذ بك من الحور بعد الكور». هل التزامك بعد عشر سنين زي أوله؟ وبعد الجواز زي قبله؟ النور اللي في قلبك هو اللي بيحمل جسمك، و«اللهم يا مقلب القلوب ثبّت قلبي على دينك»."}, {"t": 2440, "p": "يوم بدر كان عليه عمامة صفراء، فقيل: نزلت الملائكة على سيما الزبير. والملائكة بتدعيلك: ﴿ويستغفرون للذين آمنوا﴾."}, {"t": 2540, "p": "لما قالوا له: إن سيفك لصارم، قال: ليس بصارم ولكني أكرهته. اكره نفسك على الفجر والورد وقيام الليل، و«حُفّت الجنة بالمكاره»."}, {"t": 2696, "p": "يوم اليرموك قالوا له: ألا تشدّ فنشدّ معك؟ قال: إن شددت كذبتم، فشق صفوف الروم حتى خرج من الجانب الآخر وما معه أحد، وضُرب ضربتين في عاتقه، وكان قرب الستين."}, {"t": 2790, "p": "يوم الجمل قال لابنه: إنه لا يُقتل اليوم إلا ظالم أو مظلوم، وإن أكبر همي ديني، فإن عجزت عن شيء منه فاستعن عليه بمولاي، يعني الله."}, {"t": 2913, "p": "ذكّره علي: «لتقاتلنّه وأنت له ظالم»، فقال: ذكرتني ما نسيت، وانصرف، فقتله ابن جرموز غيلة بوادي السباع. وجاء علياً برأسه فقال: «بشّر قاتل ابن صفية بالنار»، وقال عن سيفه: طالما فرّج الكرب عن وجه رسول الله ﷺ."}, {"t": 3040, "p": "قال علي: إني لأرجو أن أكون أنا وطلحة والزبير وعثمان ممن قال الله فيهم: ﴿ونزعنا ما في صدورهم من غل إخواناً على سرر متقابلين﴾. استشهد سنة ٣٦ هـ."}], "status": "draft"}], "ten": true, "video": "sIKHvLqsz10", "summary": {" س ما يبقاش فيه غيبة، ولو غبت عن المسجد يحسّوا؟ حتى لو بتقمّ المسجد أو بتحفّظ العيال قرآن."}, {"t": 1678, "p": "يوم بدر كانت له اليد البيضاء، وطعن عبيدة بن سعيد بن العاص في عينه وما كان يظهر منه إلا عيناه. ويوم أحد كان من أول اللاحقين بالنبي ﷺ، وهو راوي «أوجب طلحة»."}, {"t": 1858, "p": "جمع له النبي ﷺ أبويه: «فداك أبي وأمي» يوم الأحزاب، ولما قال: «من يأتينا بخبر القوم؟» قال الزبير: أنا، ثلاث مرات، فقال: «إن لكل نبي حوارياً، وحواريّ الزبير»."}, {"t": 1980, "p": "عمر بعت مدد لعمرو بن العاص في مصر: أربعة آلاف، على كل ألف رجل بألف، منهم الزبير. وضرب يوم الخندق عثمان بن عبد الله بن المغيرة على مغفره فقدّه إلى السرج."}, {"t": 2160, "p": "سيفه كان معروف بفلوله، وكل فلّة فيه مع رسول الله ﷺ. وقال: ما مني عضو إلا وقد جُرح مع رسول الله ﷺ. وفي صدره أمثال العيون من الطعن والرمي."}, {"t": 2308, "p": "«اللهم إني أعوذ بك من الحور بعد الكور». هل التزامك بعد عشر سنين زي أوله؟ وبعد الجواز زي قبله؟ النور اللي في قلبك هو اللي بيحمل جسمك، و«اللهم يا مقلب القلوب ثبّت قلبي على دينك»."}, {"t": 2440, "p": "يوم بدر كان عليه عمامة صفراء، فقيل: نزلت الملائكة على سيما الزبير. والملائكة بتدعيلك: ﴿ويستغفرون للذين آمنوا﴾."}, {"t": 2540, "p": "لما قالوا له: إن سيفك لصارم، قال: ليس بصارم ولكني أكرهته. اكره نفسك على الفجر والورد وقيام الليل، و«حُفّت الجنة بالمكاره»."}, {"t": 2696, "p": "يوم اليرموك قالوا له: ألا تشدّ فنشدّ معك؟ قال: إن شددت كذبتم، فشق صفوف الروم حتى خرج من الجانب الآخر وما معه أحد، وضُرب ضربتين في عاتقه، وكان قرب الستين."}, {"t": 2790, "p": "يوم الجمل قال لابنه: إنه لا يُقتل اليوم إلا ظالم أو مظلوم، وإن أكبر همي ديني، فإن عجزت عن شيء منه فاستعن عليه بمولاي، يعني الله."}, {"t": 2913, "p": "ذكّره علي: «لتقاتلنّه وأنت له ظالم»، فقال: ذكرتني ما نسيت، وانصرف، فقتله ابن جرموز غيلة بوادي السباع. وجاء علياً برأسه فقال: «بشّر قاتل ابن صفية بالنار»، وقال عن سيفه: طالما فرّج الكرب عن وجه رسول الله ﷺ."}, {"t": 3040, "p": "قال علي: إني لأرجو أن أكون أنا وطلحة والزبير وعثمان ممن قال الله فيهم: ﴿ونزعنا ما في صدورهم من غل إخواناً على سرر متقابلين﴾. استشهد سنة ٣٦ هـ."}], "status": "draft"}}, {"id": "saad", "name": "سعد بن أبي وقاص", "full": "سعد بن مالك بن أهيب الزهري، أبو إسحاق", "title": "«ارمِ سعد، فداك أبي وأمي»", "oneLine": "ثبت أمام أمه، وكان أول من رمى بسهم في سبيل الله، وقاد القادسية، واعتزل الفتنة.", "links": ["muhajir", "zuhra", "sabq", "badr", "uhud", "futuh", "dua", "fitna", "ikhfa"], "axes": [{"t": "ثباته أمام أمه", "g": "g", "src": "مسلم ١٧٤٨", "f": ["الحق فوق العاطفة", "أول الاختبار صعب ثم يسهل"]}, {"t": "«فداك أبي وأمي»", "g": "g", "src": "البخاري ومسلم", "f": ["خدمة الدين بصنعتك"]}, {"t": "مستجاب الدعوة", "g": "g", "src": "البخاري (قصة أهل الكوفة)", "f": ["اتقِ دعوة المظلوم"]}, {"t": "اعتزال الفتنة", "g": "g", "src": "مسلم ٢٩٦٥", "f": ["«إن الله يحب العبد التقي الغني الخفي»"]}], "message": "اعمل لك خبيئة ما يعرفهاش حد غير ربنا.", "parts": [{"video": "rgLdNaDe_ok", "dur": "١ س", "label": "أول من رمى بسهم في سبيل الله", "intro": "حلقة عن سعد بن أبي وقاص: خال النبي ﷺ من بني زهرة، وثباته أمام أمه، وأول سهم في الإسلام، وفداك أبي وأمي يوم أحد، واستجابة دعوته، وقيادته للقادسية، واعتزاله الفتنة، وكفنه الذي خبّأه من يوم بدر.", "points": [{"t": 131, "p": "﴿وكلاً نقص عليك من أنباء الرسل ما نثبت به فؤادك﴾: قصص الصحابة بتثبّت القلوب. والصحابي مش حد التزم خمس عشر سنين، ده حد بذل من يوم ما أسلم لحد ما مات، فاسأل الله الثبات حتى الممات."}, {"t": 245, "p": "الشيطان عايز دينك لحد آخر نفس، و«اللهم إني أعوذ بك أن يتخبطني الشيطان عند الموت». وإحنا بنحضر مجالس الدين عشان ننجو، و«المرء مع من أحب»."}, {"t": 365, "p": "أسلم وعمره ١٧ سنة، وهو آخر من مات من المهاجرين ومن أهل الشورى ومن العشرة. أمه من بني زهرة قوم آمنة أم النبي ﷺ، فكان ﷺ يقول: «هذا خالي فليُرني امرؤ خاله»، مع إنه أصغر منه بعشرين سنة وزيادة."}, {"t": 720, "p": "قال: ما أسلم أحد في اليوم الذي أسلمت فيه، ولقد مكثت سبعة أيام وإني لثلث الإسلام. وأسلم على يد أبي بكر، وقبلها رأى في المنام نوراً يتبعه فوجد عنده زيداً وعلياً وأبا بكر."}, {"t": 997, "p": "أمه حلفت ما تاكل ولا تشرب لحد ما يكفر، وكان بارّ بيها جداً، فقال لها: لو كانت لك مئة نفس فخرجت نفساً نفساً ما تركت ديني. فلما شافت ثباته أكلت. أول الاختبار صعب، وبعد ما تعدّيه ربنا يفتح لك."}, {"t": 1297, "p": "«إني لأول رجل من العرب رمى بسهم في سبيل الله». كان شغله بري الأسهم والأقواس، فلما جه النداء خدم دينه بحرفته. كل صاحب صنعة يقدر ينفع بيها دينه، وكلمة «أول» غالية: «من سنّ في الإسلام سنة حسنة فله أجرها وأجر من عمل بها»."}, {"t": 1546, "p": "كانوا يغزوا ما لهم طعام إلا ورق الشجر، حتى إن أحدهم ليضع كما تضع الشاة. وفي الشِّعب لقى جلداً يابساً تحت رجله في الليل فغسله وشواه وأكله. فكيف صبرك إنت على صلاة الجماعة؟"}, {"t": 1675, "p": "لما ولي الكوفة شكاه بنو أسد إنه ما بيحسنش يصلي، فقال: «لقد خبت إذاً وضلّ عملي». كان يطوّل الأوليين في العشاء ويخفف الأخريين، فقال عمر: ذاك الظن بك."}, {"t": 1765, "p": "النبي ﷺ سهر أول مقدمه المدينة وقال: «ليت رجلاً صالحاً من أصحابي يحرسني الليلة»، فسمعوا خشخشة سلاح: سعد، قال: وقع في نفسي خوف على رسول الله، فدعا له ونام ﷺ حتى سُمع غطيطه."}, {"t": 1828, "p": "قال علي: ما رأيت رسول الله ﷺ جمع أبويه لأحد غير سعد، قال له يوم أحد: «ارمِ سعد فداك أبي وأمي». ونزل فيه وفي خمسة معه ﴿ولا تطرد الذين يدعون ربهم بالغداة والعشي﴾."}, {"t": 1922, "p": "مرض في مكة عام حجة الوداع واستأذن يوصي بماله، فقال ﷺ: «الثلث، والثلث كثير، إنك أن تذر ورثتك أغنياء خير من أن تذرهم عالة يتكففون الناس»، ومسح على وجهه وبطنه وقال: «اللهم اشفِ سعداً». الفقر مش شرط للتدين، والمال قوة تنفع بيها دينك."}, {"t": 2013, "p": "دعا له النبي ﷺ: «اللهم سدد رميته وأجب دعوته». فكان مستجاب الدعوة: دعا على اللي كذب عليه في الكوفة فطال عمره وافتقر وصار يتعرض للجواري ويقول: شيخ مفتون أصابتني دعوة سعد. اتقِ دعوة المظلوم."}, {"t": 2260, "p": "رجل كان يسب علياً وطلحة والزبير، فقال له: لا تقع في إخواني، فأبى، فصلى ركعتين ودعا، فجاء جمل يشق الناس حتى برك عليه. فقالوا: هنيئاً لك يا أبا إسحاق، استُجيبت دعوتك."}, {"t": 2420, "p": "شهد المشاهد كلها، وثبت يوم أحد، ونثل له النبي ﷺ كنانته وقال: «ارمِ فداك أبي وأمي»، وكان سعد يقول: اللهم سهمك فارمِ به عدوك. ولما رجعوا كان ﷺ يقول: هذا خالي."}, {"t": 2711, "p": "له في الصحيحين ١٥ حديثاً متفقاً عليها، منها «دعوة ذي النون: لا إله إلا أنت سبحانك إني كنت من الظالمين، لم يدعُ بها مسلم في شيء قط إلا استجاب الله له». ابدأ دعاك بيها."}, {"t": 2780, "p": "ولّاه عمر جيش القادسية ضد رستم، وكانت معركة استئصال للفرس. أصابته دمامل ما يقدرش يركب، فبنوا له سريراً على مرتفع يدير منه المعركة، وأمر برمي عيون الفيلة، وجاء المدد مع القعقاع بن عمرو على دفعات."}, {"t": 2998, "p": "عمر جعل الشورى في ستة وقال: إن أصابت الإمرة سعداً فهو ذاك، وإلا فليستعن به أيكم ما أُمّر، فإني لم أعزله عن عجز ولا خيانة."}, {"t": 3050, "p": "اعتزل الفتنة خوفاً من دم مسلم. قال لابنه: أفي الفتنة تأمرني أن أكون رأساً؟ لا والله حتى أُعطى سيفاً إن ضربت به مؤمناً نبا عنه، وإن ضربت به كافراً قتله. وسمع النبي ﷺ يقول: «إن الله يحب العبد التقي الغني الخفي»."}, {"t": 3260, "p": "توفي سنة ٥٥ هـ بالعقيق وحُمل إلى البقيع. وصّى يُكفَّن في جبة صوف لقي فيها المشركين يوم بدر وقال: إنما خبأتها لهذا. اعمل لك خبيئة بينك وبين الله ما يعرفهاش حد."}], "status": "draft"}], "ten": true, "video": "rgLdNaDe_ok", "summary": {"intro": "حلقة عن سعد بن أبي وقاص: خال النبي ﷺ من بني زهرة، وثباته أمام أمه، وأول سهم في الإسلام، وفداك أبي وأمي يوم أحد، واستجابة دعوته، وقيادته للقادسية، واعتزاله الفتنة، وكفنه الذي خبّأه من يوم بدر.", "points": [{"t": 131, "p": "﴿وكلاً نقص عليك من أنباء الرسل ما نثبت به فؤادك﴾: قصص الصحابة بتثبّت القلوب. والصحابي مش حد التزم خمس عشر سنين، ده حد بذل من يوم ما أسلم لحد ما مات، فاسأل الله الثبات حتى الممات."}, {"t": 245, "p": "الشيطان عايز دينك لحد آخر نفس، و«اللهم إني أعوذ بك أن يتخبطني الشيطان عند الموت». وإحنا بنحضر مجالس الدين عشان ننجو، و«المرء مع من أحب»."}, {"t": 365, "p": "أسلم وعمره ١٧ سنة، وهو آخر من مات من المهاجرين ومن أهل الشورى ومن العشرة. أمه من بني زهرة قوم آمنة أم النبي ﷺ، فكان ﷺ يقول: «هذا خالي فليُرني امرؤ خاله»، مع إنه أصغر منه بعشرين سنة وزيادة."}, {"t": 720, "p": "قال: ما أسلم أحد في اليوم الذي أسلمت فيه، ولقد مكثت سبعة أيام وإني لثلث الإسلام. وأسلم على يد أبي بكر، وقبلها رأى في المنام نوراً يتبعه فوجد عنده زيداً وعلياً وأبا بكر."}, {"t": 997, "p": "أمه حلفت ما تاكل ولا تشرب لحد ما يكفر، وكان بارّ بيها جداً، فقال لها: لو كانت لك مئة نفس فخرجت نفساً نفساً ما تركت ديني. فلما شافت ثباته أكلت. أول الاختبار صعب، وبعد ما تعدّيه ربنا يفتح لك."}, {"t": 1297, "p": "«إني لأول رجل من العرب رمى بسهم في سبيل الله». كان شغله بري الأسهم والأقواس، فلما جه النداء خدم دينه بحرفته. كل صاحب صنعة يقدر ينفع بيها دينه، وكلمة «أول» غالية: «من سنّ في الإسلام سنة حسنة فله أجرها وأجر من عمل بها»."}, {"t": 1546, "p": "كانوا يغزوا ما لهم طعام إلا ورق الشجر، حتى إن أحدهم ليضع كما تضع الشاة. وفي الشِّعب لقى جلداً يابساً تحت رجله في الليل فغسله وشواه وأكله. فكيف صبرك إنت على صلاة الجماعة؟"}, {"t": 1675, "p": "لما ولي الكوفة شكاه بنو أسد إنه ما بيحسنش يصلي، فقال: «لقد خبت إذاً وضلّ عملي». كان يطوّل الأوليين في العشاء ويخفف الأخريين، فقال عمر: ذاك الظن بك."}, {"t": 1765, "p": "النبي ﷺ سهر أول مقدمه المدينة وقال: «ليت رجلاً صالحاً من أصحابي يحرسني الليلة»، فسمعوا خشخشة سلاح: سعد، قال: وقع في نفسي خوف على رسول الله، فدعا له ونام ﷺ حتى سُمع غطيطه."}, {"t": 1828, "p": "قال علي: ما رأيت رسول الله ﷺ جمع أبويه لأحد غير سعد، قال له يوم أحد: «ارمِ سعد فداك أبي وأمي». ونزل فيه وفي خمسة معه ﴿ولا تطرد الذين يدعون ربهم بالغداة والعشي﴾."}, {"t": 1922, "p": "مرض في مكة عام حجة الوداع واستأذن يوصي بماله، فقال ﷺ: «الثلث، والثلث كثير، إنك أن تذر ورثتك أغنياء خير من أن تذرهم عالة يتكففون الناس»، ومسح على وجهه وبطنه وقال: «اللهم اشفِ سعداً». الفقر مش شرط للتدين، والمال قوة تنفع بيها دينك."}, {"t": 2013, "p": "دعا له النبي ﷺ: «اللهم سدد رميته وأجب دعوته». فكان مستجاب الدعوة: دعا على اللي كذب عليه في الكوفة فطال عمره وافتقر وصار يتعرض للجواري ويقول: شيخ مفتون أصابتني دعوة سعد. اتقِ دعوة المظلوم."}, {"t": 2260, "p": "رجل كان يسب علياً وطلحة والزبير، فقال له: لا تقع في إخواني، فأبى، فصلى ركعتين ودعا، فجاء جمل يشق الناس حتى برك عليه. فقالوا: هنيئاً لك يا أبا إسحاق، استُجيبت دعوتك."}, {"t": 2420, "p": "شهد المشاهد كلها، وثبت يوم أحد، ونثل له النبي ﷺ كنانته وقال: «ارمِ فداك أبي وأمي»، وكان سعد يقول: اللهم سهمك فارمِ به عدوك. ولما رجعوا كان ﷺ يقول: هذا خالي."}, {"t": 2711, "p": "له في الصحيحين ١٥ حديثاً متفقاً عليها، منها «دعوة ذي النون: لا إله إلا أنت سبحانك إني كنت من الظالمين، لم يدعُ بها مسلم في شيء قط إلا استجاب الله له». ابدأ دعاك بيها."}, {"t": 2780, "p": "ولّاه عمر جيش القادسية ضد رستم، وكانت معركة استئصال للفرس. أصابته دمامل ما يقدرش يركب، فبنوا له سريراً على مرتفع يدير منه المعركة، وأمر برمي عيون الفيلة، وجاء المدد مع القعقاع بن عمرو على دفعات."}, {"t": 2998, "p": "عمر جعل الشورى في ستة وقال: إن أصابت الإمرة سعداً فهو ذاك، وإلا فليستعن به أيكم ما أُمّر، فإني لم أعزله عن عجز ولا خيانة."}, {"t": 3050, "p": "اعتزل الفتنة خوفاً من دم مسلم. قال لابنه: أفي الفتنة تأمرني أن أكون رأساً؟ لا والله حتى أُعطى سيفاً إن ضربت به مؤمناً نبا عنه، وإن ضربت به كافراً قتله. وسمع النبي ﷺ يقول: «إن الله يحب العبد التقي الغني الخفي»."}, {"t": 3260, "p": "توفي سنة ٥٥ هـ بالعقيق وحُمل إلى البقيع. وصّى يُكفَّن في جبة صوف لقي فيها المشركين يوم بدر وقال: إنما خبأتها لهذا. اعمل لك خبيئة بينك وبين الله ما يعرفهاش حد."}], "status": "draft"}}, {"id": "abd-rahman", "name": "عبد الرحمن بن عوف", "full": "عبد الرحمن بن عوف بن عبد عوف الزهري، أبو محمد", "title": "«بارك الله لك في أهلك ومالك، دلّني على السوق»", "oneLine": "تاجر هاجر فقيراً فبارك الله في تجارته، فأنفقها في سبيل الله، وبكى خشية أن تكون حسناته عُجّلت.", "links": ["muhajir", "zuhra", "sabq", "badr", "uhud", "tabuk", "infaq", "zuhd"], "axes": [{"t": "مع سعد بن الربيع", "g": "g", "src": "البخاري", "f": ["العفة عن مال أخوك", "«دلّني على السوق»"]}, {"t": "«لا تسبوا أصحابي»", "g": "g", "src": "مسلم", "f": ["السبق له منزلة لا تُلحق"]}, {"t": "إنفاقه", "g": "y", "src": "الترمذي وطبقات ابن سعد", "f": ["المال وسيلة لا غاية", "شكر النعمة من جنسها"]}, {"t": "بكاؤه على مصعب", "g": "g", "src": "البخاري", "f": ["الخوف من تعجيل الحسنات"]}], "message": "طلّع نسبة ثابتة لله من أي دخل، مهما كان صغير.", "parts": [{"video": "fjlCyMcL9Nw", "dur": "١ س", "label": "الغنيّ الشاكر", "intro": "حلقة عن عبد الرحمن بن عوف: الدفاع عن الصحابة كمدخل، ثم التاجر الذي هاجر فقيراً، وقصته مع سعد بن الربيع، وإنفاقه على الجيش وأمهات المؤمنين، وتركه الخلافة، وبكاؤه خشية أن تكون حسناته عُجّلت له.", "points": [{"t": 140, "p": "الطعن الصريح في الدين صعب دلوقتي، فالأسهل محتوى مدفوع ينشر الشبهات، ومنه حلقات تتكلم عن الصحابة من غير ما تترضّى عليهم. الطعن في الصحابة طعن في الدين لأنهم نقلته، ومن تحت كل صحابي اتولدت مدرسة فقهية."}, {"t": 374, "p": "كان التابعون يعلّمون أولادهم حب أبي بكر وعمر كما يعلّمونهم السورة من القرآن. حبّب ولادك وبناتك في الصحابة وأمهات المؤمنين قبل ما يلاقوا قدوات تانية."}, {"t": 485, "p": "الواجب محبة الصحابة والترضي عنهم وكلهم عدول. الفتنة كانت ابتلاء، فيهم من أصاب ومن أخطأ، والله أثبت للطائفتين الإيمان. اسمع في السيرة سلسلة واتنين وعشرة، لأنك بعد عشرين سنة هتكون إنت المسؤول عن أسئلة بيتك."}, {"t": 657, "p": "عبد الرحمن بن عوف بن عبد عوف من بني زهرة. أُصيب يوم أحد فهُتم وجُرح عشرين جراحة بعضها في رجله فعرج. كان من أثرياء تجار الشام، وهاجر الهجرتين، وكان اسمه عبد عمرو أو عبد الكعبة فسمّاه النبي ﷺ عبد الرحمن، و«أحب أسمائكم إلى الله عبد الله وعبد الرحمن»."}, {"t": 855, "p": "من أول ثمانية أسلموا، على يد أبي بكر، وشهد بدراً والمشاهد كلها. كل صحابي فُتح له باب: أبو بكر في الأنساب وظّفه في الدعوة، وعبد الرحمن في التجارة حتى قال: لو رفعت حجراً لرجوت أن أصيب تحته ذهباً. شوف ربنا فتح عليك في إيه واستثمر فيه."}, {"t": 1100, "p": "هو راوي حديث «أبو بكر في الجنة، وعمر في الجنة...» اللي بتقوم عليه السلسلة كلها، وعدّ فيه نفسه."}, {"t": 1198, "p": "كان بين خالد وعبد الرحمن شيء فسبّه خالد، فقال ﷺ: «لا تسبوا أصحابي، فلو أن أحدكم أنفق مثل أحد ذهباً ما بلغ مدّ أحدهم ولا نصيفه». كانوا بشراً يخطئون لكن وقّافين عند الحق، والسبق مع النبي ﷺ له منزلة ما يلحقها اللي بعده."}, {"t": 1489, "p": "قالت عائشة إنه ﷺ قال لأزواجه: «لا يحنو عليكن بعدي إلا الصابرون»، ثم قالت: سقى الله ابن عوف من سلسبيل الجنة، لأنه باع أرضاً وقسم ثمنها في أمهات المؤمنين."}, {"t": 1542, "p": "صلى النبي ﷺ خلفه في سفر بعد ما توضأ ومسح على الخفين، فكان ممن أمّ رسول الله ﷺ."}, {"t": 1640, "p": "هاجر وساب داره وتجارته ووصل المدينة فقير: ﴿للفقراء المهاجرين الذين أُخرجوا من ديارهم وأموالهم﴾. هو كان يقدر يفضل في مكة في منعة قومه، لكن «إنما الأعمال بالنيات». ولو اتعرض عليك عرض دنيا هياكل من دينك، الدين عندك أهم ولا لأ؟"}, {"t": 1925, "p": "آخى النبي ﷺ بينه وبين سعد بن الربيع، فقال: أنا أكثر الأنصار مالاً، أقاسمك مالي نصفين، ولي امرأتان انظر أعجبهما إليك أطلقها فتتزوجها. فقال: بارك الله لك في أهلك ومالك، دلّني على السوق. ﴿يحسبهم الجاهل أغنياء من التعفف﴾."}, {"t": 2128, "p": "رجع من السوق بأقط وسمن، وبعد قليل تزوج على وزن نواة من ذهب، فقال له ﷺ: «أولم ولو بشاة». البركة في الحلال: ﴿ومن يتق الله يجعل له مخرجاً ويرزقه من حيث لا يحتسب﴾."}, {"t": 2222, "p": "﴿وأنزلنا الحديد فيه بأس شديد ومنافع للناس﴾: الأمة محتاجة قوة علمية وعملية ونفسية ومادية. في تبوك جه عثمان وعبد الرحمن بالآلاف. المساجد والدعوة محتاجين ناس بتشتغل وتنفق، مش ناس قاعدة."}, {"t": 2366, "p": "كان مليونير وما فاتتوش غزوة. الصراع مش الدنيا ولا الدين: الدنيا تستعملها في الدين، مش تاكل بدينك. أنفق نصف ماله أكثر من مرة، وكان يقسم لأهل بدر ولأمهات المؤمنين."}, {"t": 2465, "p": "جت له قافلة لها رجّة في المدينة حتى ظنوا إنه شيء حصل، فجعلها كلها في سبيل الله. اللي بيقرب من الدين بتسهل عليه القرارات الإيمانية، والفرق بين اللي بيطلع ألف واللي بيطلع مليون هو اليقين فيما عند الله."}, {"t": 2620, "p": "أوصى بمال عظيم في سبيل الله ولكل من بقي من أهل بدر، وترك خيلاً وإبلاً وغنماً وذهباً قُسم بالفؤوس. وكانت عادته كلما كسب أخرج لله. اعمل نسبة ثابتة من أي دخل، و«شكر النعمة من جنسها»."}, {"t": 2737, "p": "كانوا يقولون: أهل المدينة كلهم شركاء لابن عوف في ماله: ثلث يقرضهم، وثلث يقضي عنهم دينهم، وثلث يصلهم."}, {"t": 2806, "p": "«خياركم خياركم لنسائي»، فأوصى لأمهات المؤمنين بحديقة بيعت بأربعمائة ألف. والمال ما خلّاهوش قارون ولا بعّده عن الله، و«المؤمن في ظل صدقته»."}, {"t": 2940, "p": "يرى الشيخ إن قوته المادية كسرت احتكار اليهود لأسواق المدينة، ووفّر البضائع بسعرها للناس. والأمة اليوم محتاجة قوة اقتصادية وتقنية، والمبرمج والمصمم والمصور كل واحد يقدر يخدم دينه بصنعته."}, {"t": 3170, "p": "مع كل ده كان أبعد الناس عن الإمارة: كان من الستة أهل الشورى فخلع نفسه منها، وتولى الاختيار بينهم فاختار عثمان."}, {"t": 3260, "p": "أُتي بطعام وهو صائم فقال: قُتل مصعب بن عمير وهو خير مني، كُفّن في بردة إن غُطي رأسه بدت رجلاه، وقُتل حمزة وهو خير مني، ثم بُسط لنا من الدنيا ما بُسط، وقد خشينا أن تكون حسناتنا عُجّلت لنا، ثم جعل يبكي حتى ترك الطعام."}, {"t": 3335, "p": "قال الذهبي: هذا هو الغني الشاكر، وأويس فقير صابر، وأبو ذر أو أبو عبيدة زاهد عفيف. و«الطاعم الشاكر بمنزلة الصائم الصابر». توفي في خلافة عثمان ودُفن بالبقيع."}, {"t": 3440, "p": "اللي هيتذكر مش مالك ولا شكلك، هيتذكر بدر والجراح والعرجة اللي في سبيل الله. «اللهم اجعل لنا لسان صدق في الآخرين»."}], "status": "draft"}], "ten": true, "video": "fjlCyMcL9Nw", "summary": {"intro": "حلقة عن عبد الرحمن بن عوف: الدفاع عن الصحابة كمدخل، ثم التاجر الذي هاجر فقيراً، وقصته مع سعد بن الربيع، وإنفاقه على الجيش وأمهات المؤمنين، وتركه الخلافة، وبكاؤه خشية أن تكون حسناته عُجّلت له.", "points": [{"t": 140, "p": "الطعن الصريح في الدين صعب دلوقتي، فالأسهل محتوى مدفوع ينشر الشبهات، ومنه حلقات تتكلم عن الصحابة من غير ما تترضّى عليهم. الطعن في الصحابة طعن في الدين لأنهم نقلته، ومن تحت كل صحابي اتولدت مدرسة فقهية."}, {"t": 374, "p": "كان التابعون يعلّمون أولادهم حب أبي بكر وعمر كما يعلّمونهم السورة من القرآن. حبّب ولادك وبناتك في الصحابة وأمهات المؤمنين قبل ما يلاقوا قدوات تانية."}, {"t": 485, "p": "الواجب محبة الصحابة والترضي عنهم وكلهم عدول. الفتنة كانت ابتلاء، فيهم من أصاب ومن أخطأ، والله أثبت للطائفتين الإيمان. اسمع في السيرة سلسلة واتنين وعشرة، لأنك بعد عشرين سنة هتكون إنت المسؤول عن أسئلة بيتك."}, {"t": 657, "p": "عبد الرحمن بن عوف بن عبد عوف من بني زهرة. أُصيب يوم أحد فهُتم وجُرح عشرين جراحة بعضها في رجله فعرج. كان من أثرياء تجار الشام، وهاجر الهجرتين، وكان اسمه عبد عمرو أو عبد الكعبة فسمّاه النبي ﷺ عبد الرحمن، و«أحب أسمائكم إلى الله عبد الله وعبد الرحمن»."}, {"t": 855, "p": "من أول ثمانية أسلموا، على يد أبي بكر، وشهد بدراً والمشاهد كلها. كل صحابي فُتح له باب: أبو بكر في الأنساب وظّفه في الدعوة، وعبد الرحمن في التجارة حتى قال: لو رفعت حجراً لرجوت أن أصيب تحته ذهباً. شوف ربنا فتح عليك في إيه واستثمر فيه."}, {"t": 1100, "p": "هو راوي حديث «أبو بكر في الجنة، وعمر في الجنة...» اللي بتقوم عليه السلسلة كلها، وعدّ فيه نفسه."}, {"t": 1198, "p": "كان بين خالد وعبد الرحمن شيء فسبّه خالد، فقال ﷺ: «لا تسبوا أصحابي، فلو أن أحدكم أنفق مثل أحد ذهباً ما بلغ مدّ أحدهم ولا نصيفه». كانوا بشراً يخطئون لكن وقّافين عند الحق، والسبق مع النبي ﷺ له منزلة ما يلحقها اللي بعده."}, {"t": 1489, "p": "قالت عائشة إنه ﷺ قال لأزواجه: «لا يحنو عليكن بعدي إلا الصابرون»، ثم قالت: سقى الله ابن عوف من سلسبيل الجنة، لأنه باع أرضاً وقسم ثمنها في أمهات المؤمنين."}, {"t": 1542, "p": "صلى النبي ﷺ خلفه في سفر بعد ما توضأ ومسح على الخفين، فكان ممن أمّ رسول الله ﷺ."}, {"t": 1640, "p": "هاجر وساب داره وتجارته ووصل المدينة فقير: ﴿للفقراء المهاجرين الذين أُخرجوا من ديارهم وأموالهم﴾. هو كان يقدر يفضل في مكة في منعة قومه، لكن «إنما الأعمال بالنيات». ولو اتعرض عليك عرض دنيا هياكل من دينك، الدين عندك أهم ولا لأ؟"}, {"t": 1925, "p": "آخى النبي ﷺ بينه وبين سعد بن الربيع، فقال: أنا أكثر الأنصار مالاً، أقاسمك مالي نصفين، ولي امرأتان انظر أعجبهما إليك أطلقها فتتزوجها. فقال: بارك الله لك في أهلك ومالك، دلّني على السوق. ﴿يحسبهم الجاهل أغنياء من التعفف﴾."}, {"t": 2128, "p": "رجع من السوق بأقط وسمن، وبعد قليل تزوج على وزن نواة من ذهب، فقال له ﷺ: «أولم ولو بشاة». البركة في الحلال: ﴿ومن يتق الله يجعل له مخرجاً ويرزقه من حيث لا يحتسب﴾."}, {"t": 2222, "p": "﴿وأنزلنا الحديد فيه بأس شديد ومنافع للناس﴾: الأمة محتاجة قوة علمية وعملية ونفسية ومادية. في تبوك جه عثمان وعبد الرحمن بالآلاف. المساجد والدعوة محتاجين ناس بتشتغل وتنفق، مش ناس قاعدة."}, {"t": 2366, "p": "كان مليونير وما فاتتوش غزوة. الصراع مش الدنيا ولا الدين: الدنيا تستعملها في الدين، مش تاكل بدينك. أنفق نصف ماله أكثر من مرة، وكان يقسم لأهل بدر ولأمهات المؤمنين."}, {"t": 2465, "p": "جت له قافلة لها رجّة في المدينة حتى ظنوا إنه شيء حصل، فجعلها كلها في سبيل الله. اللي بيقرب من الدين بتسهل عليه القرارات الإيمانية، والفرق بين اللي بيطلع ألف واللي بيطلع مليون هو اليقين فيما عند الله."}, {"t": 2620, "p": "أوصى بمال عظيم في سبيل الله ولكل من بقي من أهل بدر، وترك خيلاً وإبلاً وغنماً وذهباً قُسم بالفؤوس. وكانت عادته كلما كسب أخرج لله. اعمل نسبة ثابتة من أي دخل، و«شكر النعمة من جنسها»."}, {"t": 2737, "p": "كانوا يقولون: أهل المدينة كلهم شركاء لابن عوف في ماله: ثلث يقرضهم، وثلث يقضي عنهم دينهم، وثلث يصلهم."}, {"t": 2806, "p": "«خياركم خياركم لنسائي»، فأوصى لأمهات المؤمنين بحديقة بيعت بأربعمائة ألف. والمال ما خلّاهوش قارون ولا بعّده عن الله، و«المؤمن في ظل صدقته»."}, {"t": 2940, "p": "يرى الشيخ إن قوته المادية كسرت احتكار اليهود لأسواق المدينة، ووفّر البضائع بسعرها للناس. والأمة اليوم محتاجة قوة اقتصادية وتقنية، والمبرمج والمصمم والمصور كل واحد يقدر يخدم دينه بصنعته."}, {"t": 3170, "p": "مع كل ده كان أبعد الناس عن الإمارة: كان من الستة أهل الشورى فخلع نفسه منها، وتولى الاختيار بينهم فاختار عثمان."}, {"t": 3260, "p": "أُتي بطعام وهو صائم فقال: قُتل مصعب بن عمير وهو خير مني، كُفّن في بردة إن غُطي رأسه بدت رجلاه، وقُتل حمزة وهو خير مني، ثم بُسط لنا من الدنيا ما بُسط، وقد خشينا أن تكون حسناتنا عُجّلت لنا، ثم جعل يبكي حتى ترك الطعام."}, {"t": 3335, "p": "قال الذهبي: هذا هو الغني الشاكر، وأويس فقير صابر، وأبو ذر أو أبو عبيدة زاهد عفيف. و«الطاعم الشاكر بمنزلة الصائم الصابر». توفي في خلافة عثمان ودُفن بالبقيع."}, {"t": 3440, "p": "اللي هيتذكر مش مالك ولا شكلك، هيتذكر بدر والجراح والعرجة اللي في سبيل الله. «اللهم اجعل لنا لسان صدق في الآخرين»."}], "status": "draft"}}, {"id": "abu-ubayda", "name": "أبو عبيدة بن الجراح", "full": "عامر بن عبد الله بن الجراح الفهري القرشي", "title": "«هذا أمين هذه الأمة»", "oneLine": "نزع حلقتي المغفر من وجه النبي ﷺ يوم أحد، وفتح الشام، ومات في الطاعون مع جنده.", "links": ["muhajir", "sabq", "badr", "uhud", "yarmouk", "futuh", "amana", "zuhd", "qiyada"], "axes": [{"t": "أمين الأمة", "g": "g", "src": "البخاري", "f": ["الأمانة هي الدين نفسه"]}, {"t": "سرية الخَبَط", "g": "g", "src": "البخاري ومسلم", "f": ["«هو رزق أخرجه الله لكم»"]}, {"t": "قتل أبيه يوم بدر", "g": "y", "src": "البيهقي، مرسل", "f": ["الولاء لله فوق القرابة"]}, {"t": "طاعون عمواس", "g": "y", "src": "تاريخ الطبري", "f": ["«لا أرغب بنفسي عنهم»"]}], "message": "إيه المشاهد اللي شهدتها لهذا الدين؟", "parts": [{"video": "Bre8ZCiXaIY", "dur": "٥٨ د", "label": "أمين هذه الأمة", "intro": "حلقة عن أبي عبيدة عامر بن الجراح: لقب «أمين هذه الأمة»، وثنيتاه يوم أحد، وسرية الخَبَط والحوت، وتنازله لعمرو في ذات السلاسل، وزهده أميراً على الشام، واستشهاده في طاعون عمواس.", "points": [{"t": 95, "p": "كان من أحب الرجال للنبي ﷺ، وأمّره على سرية فيها أبو بكر وعمر، وقدّمه أبو بكر للخلافة يوم السقيفة، وأمير فتوح الشام. ما ترك باباً في الدين إلا ضرب فيه بسهم."}, {"t": 290, "p": "الشهادة بالجنة مش محصورة في العشرة، فبلال سمع النبي ﷺ دفّ نعليه في الجنة. لكن أبو عبيدة اختص بلقب «أمين هذه الأمة»، و﴿إنا عرضنا الأمانة﴾: الأمانة هي الدين نفسه."}, {"t": 465, "p": "عامر بن عبد الله بن الجراح، فهري قرشي، يلتقي مع النبي ﷺ في فهر. كان نحيفاً طويلاً خفيف اللحية، أثرم الثنيتين من يوم أحد."}, {"t": 540, "p": "أسلم في ساعة واحدة مع عبد الرحمن بن عوف وعثمان بن مظعون وأبي سلمة، على يد أبي بكر وقبل دار الأرقم. كل إناء ينضح بما فيه: اللي الدين في قلبه بجد ما يقدرش يسكت عنه."}, {"t": 765, "p": "جاء وفد نجران ومعهم السيد والعاقب للمباهلة، فخافوا وقالوا: إن كان نبياً ولاعنّاه لا نفلح نحن ولا عقبنا، وطلبوا رجلاً أميناً. فقال ﷺ: «لأبعثن معكم رجلاً أميناً حق أمين»، فاستشرف لها الصحابة، فقال: «قم يا أبا عبيدة، هذا أمين هذه الأمة»."}, {"t": 870, "p": "طلبهم «يعلّمنا الإسلام والسنة» رد على منكري السنة: إزاي تتعلم الدين من غير ما تعرف النبي ﷺ كان بيعامل أهله وصحابه إزاي، وحتى غضبه وسكوته كانت أحكام."}, {"t": 1010, "p": "شهد المشاهد كلها. السؤال لك: إيه المشاهد اللي شهدتها لهذا الدين؟ قال الحسن عن قوم يرجون ولا يعملون: كذبوا، لو أحسنوا الظن لأحسنوا العمل. «بلّغوا عني ولو آية»."}, {"t": 1237, "p": "قال عمر لأصحابه: تمنّوا، فتمنوا البيت ملآن ذهب ينفقونه، فقال: لكني أتمنى رجالاً مثل أبي عبيدة. و«الناس كإبل مئة لا تكاد تجد فيها راحلة»."}, {"t": 1340, "p": "لن يفهم هذا الدين إلا من تحرك به بين الناس. أغلب قبور الصحابة مش في مكة والمدينة، وأبو عبيدة مدفون في الأردن. والجهاد يبدأ بالكلمة: ﴿وجاهدهم به جهاداً كبيراً﴾ يعني بالقرآن."}, {"t": 1560, "p": "اللي يأخذ بالعزائم هم اللي حملوا الدين، زي مصعب في المدينة اللي جاه سيد بني عبد الأشهل بالحربة. وإنت خايف تكلم صحابك المسلمين عن ربنا."}, {"t": 1585, "p": "يوم بدر كان أبوه يتصدّى له وهو يحيد عنه، فلما أكثر قصده فقتله، فنزلت ﴿لا تجد قوماً يؤمنون بالله واليوم الآخر يوادّون من حادّ الله ورسوله ولو كانوا آباءهم﴾."}, {"t": 1715, "p": "يوم أحد دخلت حلقتا المغفر في وجه النبي ﷺ، فأقسم أبو عبيدة على أبي بكر أن يتركها له، فنزعها بأسنانه حتى لا يؤذيه فسقطت ثنيتاه، فكان أحسن الناس هتماً."}, {"t": 1844, "p": "أمّره النبي ﷺ كثيراً، والإمارة أمانة ثقيلة: إمام يصلي بهم ويُستفتى ويقدّم بهم على العدو، وقرار غلط ممكن يهلك جيش."}, {"t": 1950, "p": "سرية الخَبَط: ثلاثمئة رجل ما معاهم إلا جراب تمر، كان يعطيهم تمرة يمصّونها ويشربون عليها الماء، ثم أكلوا ورق الشجر، فألقى البحر حوتاً اسمه العنبر أكلوا منه شهراً، وقعد ١٣ رجلاً في وقب عينه، ونصب ضلعاً من أضلاعه فمر تحته البعير."}, {"t": 2120, "p": "قال أبو عبيدة أول الأمر: ميتة، ثم قال: نحن رسل رسول الله وقد اضطررتم فكلوا. فلما رجعوا قال ﷺ: «هو رزق أخرجه الله لكم، فهل معكم من لحمه شيء فتطعمونا؟». اللي يتحرك في الدين يشوف الكرامات، وكل رزق تعرف إنه من الله مش صدفة."}, {"t": 2330, "p": "ذات السلاسل: أمير الجيش عمرو بن العاص، ولما طلب مدداً جاء أبو عبيدة على المهاجرين ومعه أبو بكر وعمر، فحصل خلاف على الإمرة، فقال أبو عبيدة: النبي ﷺ قال لي: إن قدمت على صاحبك فتطاوعا، وسلّم الإمرة لعمرو حفظاً لوحدة الصف."}, {"t": 2486, "p": "يوم السقيفة قال أبو بكر: رضيت لكم أحد هذين الرجلين، وأخذ بيد عمر وأبي عبيدة. وأبو عبيدة ما تكلمش لنفسه بكلمة."}, {"t": 2570, "p": "دخل عليه عمر وهو أمير الشام فما وجد في بيته إلا سيفه وترسه ورحله، فبكى وقال: غيّرتنا الدنيا كلنا غيرك يا أبا عبيدة. الزهد إن الدنيا تجيلك وإنت تسيبها، مش إن الفقير يقول أنا زاهد."}, {"t": 2700, "p": "لما عزل عمر خالداً وولّى أبا عبيدة أخفى الكتاب حتى انتهت المعركة خشية فتنة الجيش، وقال لخالد: ما سلطان الدنيا أريد، ولا للدنيا أعمل، وإنما نحن إخوان، وما يضر الرجل أن يليه أخوه في دينه."}, {"t": 2855, "p": "في طريق الشام خلع عمر خفيه وخاض المخاضة بناقته، فقال أبو عبيدة: ما يسرّني أن أهل البلد استشرفوك، فقال: نحن قوم أعزنا الله بالإسلام، فمهما نطلب العزة بغير ما أعزنا الله به أذلنا الله."}, {"t": 3020, "p": "في طاعون عمواس سنة ١٨ هـ كتب له عمر: عرضت لي حاجة لا غنى بي عنك فيها فعجّل إليّ. ففهم وكتب: إني في جند من المسلمين لا أرغب بنفسي عنهم، فحلّلني من عزمتك. فبكى عمر. وكان يقول: لو استخلفت أبا عبيدة فسألني ربي قلت: سمعت نبيك يقول إنه أمين هذه الأمة."}, {"t": 3130, "p": "سئلت عائشة: أي أصحابه كان أحب إليه؟ قالت: أبو بكر، ثم عمر، ثم أبو عبيدة بن الجراح."}, {"t": 3320, "p": "أمره عمر أن يخرج بالناس لأرض مرتفعة، فلما وضع رجله في الركاب طُعن. واستخلف معاذ بن جبل، فخطب: توبوا إلى الله، ومن كان عليه دين فليقضه، ومن هاجر أخاه فليصالحه، وقال: ما رأيت رجلاً أبرّ صدراً ولا أبعد غائلة ولا أنصح للعامة منه."}], "status": "draft"}], "ten": true, "video": "Bre8ZCiXaIY", "summary": {"intro": "حلقة عن أبي عبيدة عامر بن الجراح: لقب «أمين هذه الأمة»، وثنيتاه يوم أحد، وسرية الخَبَط والحوت، وتنازله لعمرو في ذات السلاسل، وزهده أميراً على الشام، واستشهاده في طاعون عمواس.", "points": [{"t": 95, "p": "كان من أحب الرجال للنبي ﷺ، وأمّره على سرية فيها أبو بكر وعمر، وقدّمه أبو بكر للخلافة يوم السقيفة، وأمير فتوح الشام. ما ترك باباً في الدين إلا ضرب فيه بسهم."}, {"t": 290, "p": "الشهادة بالجنة مش محصورة في العشرة، فبلال سمع النبي ﷺ دفّ نعليه في الجنة. لكن أبو عبيدة اختص بلقب «أمين هذه الأمة»، و﴿إنا عرضنا الأمانة﴾: الأمانة هي الدين نفسه."}, {"t": 465, "p": "عامر بن عبد الله بن الجراح، فهري قرشي، يلتقي مع النبي ﷺ في فهر. كان نحيفاً طويلاً خفيف اللحية، أثرم الثنيتين من يوم أحد."}, {"t": 540, "p": "أسلم في ساعة واحدة مع عبد الرحمن بن عوف وعثمان بن مظعون وأبي سلمة، على يد أبي بكر وقبل دار الأرقم. كل إناء ينضح بما فيه: اللي الدين في قلبه بجد ما يقدرش يسكت عنه."}, {"t": 765, "p": "جاء وفد نجران ومعهم السيد والعاقب للمباهلة، فخافوا وقالوا: إن كان نبياً ولاعنّاه لا نفلح نحن ولا عقبنا، وطلبوا رجلاً أميناً. فقال ﷺ: «لأبعثن معكم رجلاً أميناً حق أمين»، فاستشرف لها الصحابة، فقال: «قم يا أبا عبيدة، هذا أمين هذه الأمة»."}, {"t": 870, "p": "طلبهم «يعلّمنا الإسلام والسنة» رد على منكري السنة: إزاي تتعلم الدين من غير ما تعرف النبي ﷺ كان بيعامل أهله وصحابه إزاي، وحتى غضبه وسكوته كانت أحكام."}, {"t": 1010, "p": "شهد المشاهد كلها. السؤال لك: إيه المشاهد اللي شهدتها لهذا الدين؟ قال الحسن عن قوم يرجون ولا يعملون: كذبوا، لو أحسنوا الظن لأحسنوا العمل. «بلّغوا عني ولو آية»."}, {"t": 1237, "p": "قال عمر لأصحابه: تمنّوا، فتمنوا البيت ملآن ذهب ينفقونه، فقال: لكني أتمنى رجالاً مثل أبي عبيدة. و«الناس كإبل مئة لا تكاد تجد فيها راحلة»."}, {"t": 1340, "p": "لن يفهم هذا الدين إلا من تحرك به بين الناس. أغلب قبور الصحابة مش في مكة والمدينة، وأبو عبيدة مدفون في الأردن. والجهاد يبدأ بالكلمة: ﴿وجاهدهم به جهاداً كبيراً﴾ يعني بالقرآن."}, {"t": 1560, "p": "اللي يأخذ بالعزائم هم اللي حملوا الدين، زي مصعب في المدينة اللي جاه سيد بني عبد الأشهل بالحربة. وإنت خايف تكلم صحابك المسلمين عن ربنا."}, {"t": 1585, "p": "يوم بدر كان أبوه يتصدّى له وهو يحيد عنه، فلما أكثر قصده فقتله، فنزلت ﴿لا تجد قوماً يؤمنون بالله واليوم الآخر يوادّون من حادّ الله ورسوله ولو كانوا آباءهم﴾."}, {"t": 1715, "p": "يوم أحد دخلت حلقتا المغفر في وجه النبي ﷺ، فأقسم أبو عبيدة على أبي بكر أن يتركها له، فنزعها بأسنانه حتى لا يؤذيه فسقطت ثنيتاه، فكان أحسن الناس هتماً."}, {"t": 1844, "p": "أمّره النبي ﷺ كثيراً، والإمارة أمانة ثقيلة: إمام يصلي بهم ويُستفتى ويقدّم بهم على العدو، وقرار غلط ممكن يهلك جيش."}, {"t": 1950, "p": "سرية الخَبَط: ثلاثمئة رجل ما معاهم إلا جراب تمر، كان يعطيهم تمرة يمصّونها ويشربون عليها الماء، ثم أكلوا ورق الشجر، فألقى البحر حوتاً اسمه العنبر أكلوا منه شهراً، وقعد ١٣ رجلاً في وقب عينه، ونصب ضلعاً من أضلاعه فمر تحته البعير."}, {"t": 2120, "p": "قال أبو عبيدة أول الأمر: ميتة، ثم قال: نحن رسل رسول الله وقد اضطررتم فكلوا. فلما رجعوا قال ﷺ: «هو رزق أخرجه الله لكم، فهل معكم من لحمه شيء فتطعمونا؟». اللي يتحرك في الدين يشوف الكرامات، وكل رزق تعرف إنه من الله مش صدفة."}, {"t": 2330, "p": "ذات السلاسل: أمير الجيش عمرو بن العاص، ولما طلب مدداً جاء أبو عبيدة على المهاجرين ومعه أبو بكر وعمر، فحصل خلاف على الإمرة، فقال أبو عبيدة: النبي ﷺ قال لي: إن قدمت على صاحبك فتطاوعا، وسلّم الإمرة لعمرو حفظاً لوحدة الصف."}, {"t": 2486, "p": "يوم السقيفة قال أبو بكر: رضيت لكم أحد هذين الرجلين، وأخذ بيد عمر وأبي عبيدة. وأبو عبيدة ما تكلمش لنفسه بكلمة."}, {"t": 2570, "p": "دخل عليه عمر وهو أمير الشام فما وجد في بيته إلا سيفه وترسه ورحله، فبكى وقال: غيّرتنا الدنيا كلنا غيرك يا أبا عبيدة. الزهد إن الدنيا تجيلك وإنت تسيبها، مش إن الفقير يقول أنا زاهد."}, {"t": 2700, "p": "لما عزل عمر خالداً وولّى أبا عبيدة أخفى الكتاب حتى انتهت المعركة خشية فتنة الجيش، وقال لخالد: ما سلطان الدنيا أريد، ولا للدنيا أعمل، وإنما نحن إخوان، وما يضر الرجل أن يليه أخوه في دينه."}, {"t": 2855, "p": "في طريق الشام خلع عمر خفيه وخاض المخاضة بناقته، فقال أبو عبيدة: ما يسرّني أن أهل البلد استشرفوك، فقال: نحن قوم أعزنا الله بالإسلام، فمهما نطلب العزة بغير ما أعزنا الله به أذلنا الله."}, {"t": 3020, "p": "في طاعون عمواس سنة ١٨ هـ كتب له عمر: عرضت لي حاجة لا غنى بي عنك فيها فعجّل إليّ. ففهم وكتب: إني في جند من المسلمين لا أرغب بنفسي عنهم، فحلّلني من عزمتك. فبكى عمر. وكان يقول: لو استخلفت أبا عبيدة فسألني ربي قلت: سمعت نبيك يقول إنه أمين هذه الأمة."}, {"t": 3130, "p": "سئلت عائشة: أي أصحابه كان أحب إليه؟ قالت: أبو بكر، ثم عمر، ثم أبو عبيدة بن الجراح."}, {"t": 3320, "p": "أمره عمر أن يخرج بالناس لأرض مرتفعة، فلما وضع رجله في الركاب طُعن. واستخلف معاذ بن جبل، فخطب: توبوا إلى الله، ومن كان عليه دين فليقضه، ومن هاجر أخاه فليصالحه، وقال: ما رأيت رجلاً أبرّ صدراً ولا أبعد غائلة ولا أنصح للعامة منه."}], "status": "draft"}}, {"id": "said", "name": "سعيد بن زيد", "full": "سعيد بن زيد بن عمرو بن نفيل العدوي", "title": "«وإن شئت سمّيت لكم العاشر»", "oneLine": "ابن الحنيف اللي طلب دين إبراهيم، وفي بيته أسلم عمر، وعاش عبداً خفياً.", "links": ["muhajir", "adi", "sabq", "uhud", "yarmouk", "bait", "dua", "ikhfa"], "axes": [{"t": "أبوه زيد بن عمرو", "g": "g", "src": "البخاري", "f": ["الأب قدوة بالفعل"]}, {"t": "إسلام عمر في بيته", "g": "y", "src": "سيرة ابن إسحاق", "f": ["خلي بيتك منارة"]}, {"t": "دعوته على أروى", "g": "g", "src": "مسلم ١٦١٠", "f": ["«من أخذ شبراً من الأرض ظلماً»"]}, {"t": "حديث العشرة", "g": "g", "src": "أبو داود والترمذي", "f": ["كتم ذكر نفسه حتى سألوه"]}], "message": "خلّي بيتك منارة: درس أسبوعي أو ورد مع أهلك.", "parts": [{"video": "Jo9qk5mbfNE", "dur": "٤٩ د", "label": "الجنديّ الخفيّ", "intro": "الحلقة الأخيرة من العشرة: سعيد بن زيد، ابن الحنيف زيد بن عمرو بن نفيل، وبيته اللي أسلم فيه عمر، وسهمه في بدر، ودعوته على أروى، وخلاصة السلسلة.", "points": [{"t": 134, "p": "تصحيح من الحلقة السابقة: السيد والعاقب من نجران ما أسلموش ساعتها، صالحوا النبي ﷺ على الجزية وطلبوا رجلاً أميناً يقبضها، فبعث أبا عبيدة، وأسلما متأخرين كما قال ابن سعد."}, {"t": 200, "p": "سعيد ما لوش مرويات كتير ولا قصص طويلة، وكأنه العبد التقي الخفي. وحسبك إنه مبشر بالجنة، وكان على حراء لما قال ﷺ: «اثبت، فما عليك إلا نبي أو صديق أو شهيد». فيه عباد ربنا أخّر ثوابهم كله للآخرة."}, {"t": 444, "p": "سعيد بن زيد بن عمرو بن نفيل العدوي، من السابقين، أسلم قبل دار الأرقم، وعُدّ من البدريين وهو ما شهدهاش."}, {"t": 474, "p": "«وينشأ ناشئ الفتيان منا على ما كان عوّده أبوه». أبوه زيد اعتزل الأوثان مع ورقة بن نوفل وعبيد الله بن جحش وعثمان بن الحويرث، وقالوا: والله ما قومكم على شيء، أخطأوا دين إبراهيم."}, {"t": 560, "p": "خرج زيد يطلب الدين، وشمّ اليهودية والنصرانية فلم يرتح لهما، فقال له راهب بالشام: إنك لتطلب ديناً ما هو بموجود اليوم، فالحق ببلدك فإن الله باعث من قومك من يأتي بدين إبراهيم. فمات قبل البعثة، وقال ﷺ: «يُبعث يوم القيامة أمة وحده»."}, {"t": 668, "p": "قالت أسماء: رأيته مسنداً ظهره إلى الكعبة يقول: يا معشر قريش، والله ما منكم أحد على دين إبراهيم غيري. وكان يُحيي الموؤودة: يقول للرجل لا تقتلها أنا أكفيك مؤونتها. وكان يقول: الشاة خلقها الله وأنزل لها من السماء الماء ثم تذبحونها على غير اسم الله."}, {"t": 782, "p": "الدين بيتنقل بالفعل مش بالكلام: الابن بيشرب الصلاة والورد والقرآن من حال أبوه وأمه في البيت. وسعيد شرب من أبوه روح البحث عن الحق، فأول ما سمع بالبعثة أسلم."}, {"t": 870, "p": "كان متزوج فاطمة بنت الخطاب، وعمر متزوج أخته عاتكة. وكان خبّاب بن الأرت، الحداد المعذَّب، بيعلّمهم القرآن في بيتهم. اختار وهو قرشي من الأشراف إنه يقعد هو ومراته بين يدين خبّاب."}, {"t": 1005, "p": "اختار البيت اللي يكون منارة للدين، مش خرابة ما يُقرأ فيها كتاب الله. افتح بيتك لدرس أسبوعي، والأخوات يجمعوا جاراتهم على القرآن أو الأربعين النووية."}, {"t": 1062, "p": "قال سعيد: لو رأيتني موثقي عمر على الإسلام أنا وأخته وما أسلم. ثم قرأ عمر صدر طه فلان قلبه، وأخذوه للنبي ﷺ في دار الأرقم. فعمر في ميزان سعيد وفاطمة، وهي بركة البيت المسلم ودعوة النبي ﷺ: «اللهم أعز الإسلام بأحب الرجلين إليك»."}, {"t": 1266, "p": "رواية سعيد لحديث العشرة عدّ فيها النبي ﷺ أولهم، وكان يسكت عن العاشر حتى ألحّوا عليه فقال: سعيد بن زيد. الشيطان يظل بالإنسان حتى يحدّث بعمله، وكان سفيان يقول: لا أعتدّ بما ظهر من عملي. اعمل لك خبيئة."}, {"t": 1453, "p": "«اللهم إني أعوذ بك أن أشرك بك شيئاً أعلمه، وأستغفرك لما لا أعلمه»، لأن الشرك فينا أخفى من دبيب النمل."}, {"t": 1456, "p": "قال سعيد بن جبير: كان مقام أبي بكر وعمر وعثمان وعلي وطلحة والزبير وسعد وعبد الرحمن وسعيد بن زيد أمام رسول الله ﷺ في القتال، ووراءه في الصلاة."}, {"t": 1551, "p": "شهد المشاهد بعد النبي ﷺ: قتال المرتدين وفتوح الشام مع أبي عبيدة. الصحبة تتفكك لما الشيخ يغيب، فلازم يكون لك حبل مع القرآن: ﴿واتلُ ما أوحي إليك﴾ جت قبل ﴿واصبر نفسك﴾."}, {"t": 1620, "p": "يوم مات النبي ﷺ ذُهل الصحابة، وارتدت الجزيرة، وبعد سنتين كانوا بيفتحوا الشام وفارس، لأنهم تمسكوا بالوحي مش بالأشخاص. «نعوذ بالله من الحور بعد الكور»."}, {"t": 1748, "p": "بعثه النبي ﷺ هو وطلحة يتحسسوا خبر العير، فرجعوا بعد بدر، فضرب له بسهمه، فقال: وأجري يا رسول الله؟ قال: «وأجرك». فعُدّ من البدريين."}, {"t": 1800, "p": "في اليرموك تأخر أبو عبيدة لمؤخرة الجيش يثبّت من يفر، وترك قيادة القلب لسعيد. اللي ربنا فتح عليه بيتعلق بيه اللي حواليه، و«التلبّس بالفرض»: لو إنت الوحيد اللي يعرف يقوم بيه، بتأثم لو سبته."}, {"t": 2077, "p": "ادعت أروى بنت أويس إنه أخذ من أرضها، فقال لمروان: أنا آخذ من أرضها بعد ما سمعت رسول الله ﷺ يقول «من أخذ شبراً من الأرض ظلماً طُوّقه إلى سبع أرضين»؟ ثم قال: اللهم إن كانت كاذبة فأعمِ بصرها واقتلها في أرضها. فعميت ووقعت في حفرة في أرضها فماتت."}, {"t": 2128, "p": "توفي بالعقيق سنة ٥١ هـ وهو ابن بضع وسبعين، ودُفن بالمدينة، ونزل في قبره سعد وابن عمر."}, {"t": 2335, "p": "السابقون سبقوا بالسبق نفسه: ﴿لا يستوي منكم من أنفق من قبل الفتح وقاتل﴾، و﴿والسابقون السابقون أولئك المقربون﴾، حتى خاف عمر ألا يكون منهم."}, {"t": 2414, "p": "خلاصة السلسلة: إنك تشوف الإسلام بعيون الصحابة. في كل قصة من العشرة حد أوذي من أهله وساب ماله، فهتلاقي قصة تشبهك. وأعظم ما تخرج بيه حبهم: «المرء مع من أحب»، قال أنس: وأنا أحب أبا بكر وعمر وإن لم أعمل بعملهم."}, {"t": 2610, "p": "كثير من كبار الصحابة كانوا قليلي الرواية خوفاً من «من كذب عليّ متعمداً». والدين دين عمل وحركة وعلم وبذل، وأغلب الصحابة مدفونين خارج مكة والمدينة لأنهم حملوا الأمانة للناس."}], "status": "draft"}], "ten": true, "video": "Jo9qk5mbfNE", "summary": {"intro": "الحلقة الأخيرة من العشرة: سعيد بن زيد، ابن الحنيف زيد بن عمرو بن نفيل، وبيته اللي أسلم فيه عمر، وسهمه في بدر، ودعوته على أروى، وخلاصة السلسلة.", "points": [{"t": 134, "p": "تصحيح من الحلقة السابقة: السيد والعاقب من نجران ما أسلموش ساعتها، صالحوا النبي ﷺ على الجزية وطلبوا رجلاً أميناً يقبضها، فبعث أبا عبيدة، وأسلما متأخرين كما قال ابن سعد."}, {"t": 200, "p": "سعيد ما لوش مرويات كتير ولا قصص طويلة، وكأنه العبد التقي الخفي. وحسبك إنه مبشر بالجنة، وكان على حراء لما قال ﷺ: «اثبت، فما عليك إلا نبي أو صديق أو شهيد». فيه عباد ربنا أخّر ثوابهم كله للآخرة."}, {"t": 444, "p": "سعيد بن زيد بن عمرو بن نفيل العدوي، من السابقين، أسلم قبل دار الأرقم، وعُدّ من البدريين وهو ما شهدهاش."}, {"t": 474, "p": "«وينشأ ناشئ الفتيان منا على ما كان عوّده أبوه». أبوه زيد اعتزل الأوثان مع ورقة بن نوفل وعبيد الله بن جحش وعثمان بن الحويرث، وقالوا: والله ما قومكم على شيء، أخطأوا دين إبراهيم."}, {"t": 560, "p": "خرج زيد يطلب الدين، وشمّ اليهودية والنصرانية فلم يرتح لهما، فقال له راهب بالشام: إنك لتطلب ديناً ما هو بموجود اليوم، فالحق ببلدك فإن الله باعث من قومك من يأتي بدين إبراهيم. فمات قبل البعثة، وقال ﷺ: «يُبعث يوم القيامة أمة وحده»."}, {"t": 668, "p": "قالت أسماء: رأيته مسنداً ظهره إلى الكعبة يقول: يا معشر قريش، والله ما منكم أحد على دين إبراهيم غيري. وكان يُحيي الموؤودة: يقول للرجل لا تقتلها أنا أكفيك مؤونتها. وكان يقول: الشاة خلقها الله وأنزل لها من السماء الماء ثم تذبحونها على غير اسم الله."}, {"t": 782, "p": "الدين بيتنقل بالفعل مش بالكلام: الابن بيشرب الصلاة والورد والقرآن من حال أبوه وأمه في البيت. وسعيد شرب من أبوه روح البحث عن الحق، فأول ما سمع بالبعثة أسلم."}, {"t": 870, "p": "كان متزوج فاطمة بنت الخطاب، وعمر متزوج أخته عاتكة. وكان خبّاب بن الأرت، الحداد المعذَّب، بيعلّمهم القرآن في بيتهم. اختار وهو قرش function companion(l, pi){

      ${related(l).length ? `<div class="box"><h3>صحابة يجمعهم بيه باب</h3><div class="rel">${related(l).map(x => `<a href="#${x.o.id}"><span class="n">${esc(x.o.name)}</span><span class="w">${x.s.map(k => esc(T[k].label)).join(" · ")}</span></a>`).join("")}</div></div>` : ""}
